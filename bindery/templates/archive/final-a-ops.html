<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Ops</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;
  --border:#28243a;--border2:#342f4e;
  --text:#e0dced;--text2:#908ca5;--text3:#5c5878;
  --lav:#8b5cf6;--lav-dim:rgba(139,92,246,.10);
  --rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:4px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;flex-direction:column}

/* ─── Top bar ─── */
.topbar{height:36px;min-height:36px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-logo{font-size:16px;font-weight:700;color:var(--lav)}
.tb-sep{width:1px;height:16px;background:var(--border2)}
.tb-label{font-size:11px;color:var(--text2)}
.tb-spacer{flex:1}
.tb-tag{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:1px 7px;border-radius:99px}
.tb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tb-dot.run{background:var(--amber);box-shadow:0 0 4px var(--amber);animation:pulse 1.3s infinite}
.tb-dot.live{background:var(--green);box-shadow:0 0 3px var(--green)}
.tb-toggle{font-size:9px;color:var(--text3);cursor:pointer;padding:2px 8px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);transition:.15s;user-select:none}
.tb-toggle:hover{border-color:var(--lav);color:var(--text2)}

/* ─── Flame chart (collapsible) ─── */
.flame-wrap{background:var(--bg1);border-bottom:1px solid var(--border);overflow:hidden;padding:6px 16px;flex-shrink:0;transition:max-height .3s,padding .3s}
.flame-wrap.collapsed{max-height:0;padding:0 16px;border-bottom:none}
.flame-header{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px;font-weight:600}
.flame-chart{position:relative;height:70px;overflow:hidden}
.flame-row{position:absolute;left:0;right:0}
.flame-row[data-depth="0"]{top:0;height:22px}
.flame-row[data-depth="1"]{top:24px;height:20px}
.flame-row[data-depth="2"]{top:46px;height:18px}
.flame-bar{position:absolute;height:100%;border-radius:3px;display:flex;align-items:center;padding:0 6px;font-family:'Fira Code',monospace;font-size:8px;font-weight:500;color:rgba(0,0,0,.8);overflow:hidden;white-space:nowrap;opacity:.85;cursor:pointer;transition:width .5s ease}
.flame-bar:hover{opacity:1;filter:brightness(1.1)}
.flame-bar .fb-dur{margin-left:auto;padding-left:6px;font-weight:400;opacity:.6}
.flame-axis{display:flex;justify-content:space-between;padding:2px 0 0;font-size:7px;color:var(--text3);font-family:'Fira Code',monospace}

/* ─── Main: stream + status ─── */
.main-split{flex:1;display:flex;min-height:0}

/* Stream (flat timeline from V10) */
.stream-col{flex:1;display:flex;flex-direction:column;min-width:0}
.stream-scroll{flex:1;overflow-y:auto;padding:6px 0}
.stream-inner{padding:0 16px;display:flex;flex-direction:column;gap:0}

.ev{display:flex;align-items:flex-start;gap:0;min-height:22px;position:relative}
.ev-ts{width:60px;flex-shrink:0;font-family:'Fira Code',monospace;font-size:8px;color:var(--text3);padding-top:3px;text-align:right;padding-right:10px;user-select:none}
.ev-gut{width:20px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative}
.ev-dot-w{width:8px;height:8px;display:flex;align-items:center;justify-content:center;margin-top:5px;position:relative;z-index:1}
.ev-dot{width:5px;height:5px;border-radius:50%}
.ev-line{position:absolute;top:13px;bottom:-2px;width:1px;background:var(--border)}
.ev-ct{flex:1;min-width:0;padding:1px 0 3px}
.ev.n1 .ev-gut{padding-left:12px}.ev.n2 .ev-gut{padding-left:24px}

.ev-user{font-size:12px;font-weight:500;color:var(--text);display:inline-block;padding:3px 8px;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.12);border-radius:var(--r)}
.ev-agent{font-family:'Fira Code',monospace;font-size:10px;font-weight:500}
.ev-tool{font-family:'Fira Code',monospace;font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px}
.ev-tool .tn{flex-shrink:0}.ev-tool .ta{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-tool .sd{color:var(--green);font-size:9px}.ev-tool .sr{color:var(--amber);font-size:9px}.ev-tool .se{color:var(--red);font-size:9px}
.ev-think{font-size:10px;color:var(--text3);font-style:italic;font-family:'Fira Code',monospace}
.ev-ai{font-size:12px;line-height:1.55}
.ev-ai code{font-family:'Fira Code',monospace;font-size:10px;background:var(--bg3);border:1px solid var(--border);padding:1px 3px;border-radius:2px;color:var(--lav)}
.ev-err{font-size:10px;color:var(--red)}
.ev-ok{font-size:10px;color:var(--green)}
.ev-skill{font-size:10px;color:var(--amber);font-family:'Fira Code',monospace}
.ev-sep{font-size:8px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 0}

/* ─── Status panel (from V6/V4) ─── */
.status-panel{width:190px;min-width:190px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;font-family:'Fira Code',monospace;font-size:10px}
.sp-head{padding:6px 12px;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);border-bottom:1px solid var(--border)}
.sp-section{padding:6px 12px;border-bottom:1px solid var(--border)}
.sp-label{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.sp-val{font-size:10px;color:var(--text2)}
.sp-val.hi{color:var(--lav)}
.sp-meter{height:3px;background:var(--bg3);border-radius:2px;margin-top:4px;overflow:hidden}
.sp-meter-fill{height:100%;border-radius:2px;transition:width .5s;background:var(--lav)}
.sp-log{flex:1;overflow-y:auto;padding:2px 0}
.sp-log-item{padding:1px 12px;font-size:7px;color:var(--text3)}
.sp-log-item .lts{margin-right:4px}

/* ─── Input ─── */
.input-wrap{border-top:1px solid var(--border);background:var(--bg1);padding:8px 16px;flex-shrink:0}
.input-inner{display:flex;gap:8px;align-items:flex-end}
textarea.prompt{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:12px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:34px;max-height:120px;line-height:1.5;transition:.15s}
textarea.prompt:focus{border-color:var(--lav)}
textarea.prompt::placeholder{color:var(--text3)}
button.send{background:var(--lav);border:none;border-radius:var(--r);color:#fff;padding:7px 16px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:.15s}
button.send:hover{filter:brightness(1.15)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.fi{animation:fadeIn .15s ease}
@keyframes growBar{from{width:0!important}}
.bar-anim{animation:growBar .5s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Bindery</span><div class="tb-sep"></div>
  <span class="tb-label">Auth Module Refactor</span><span class="tb-spacer"></span>
  <span class="tb-toggle" id="flame-toggle">▾ timeline</span>
  <div class="tb-sep"></div>
  <span class="tb-tag">glm-4.5-flash</span>
  <div class="tb-dot" id="gdot"></div>
</div>

<div class="flame-wrap" id="flame-wrap">
  <div class="flame-header">Execution Timeline</div>
  <div class="flame-chart" id="flame"></div>
  <div class="flame-axis"><span>0s</span><span>10s</span><span>20s</span><span>30s</span><span>40s</span></div>
</div>

<div class="main-split">
  <div class="stream-col">
    <div class="stream-scroll"><div class="stream-inner" id="stream"></div></div>
    <div class="input-wrap"><div class="input-inner">
      <textarea class="prompt" placeholder="Write something…" rows="1"></textarea>
      <button class="send">Send</button>
    </div></div>
  </div>

  <div class="status-panel">
    <div class="sp-head">Status</div>
    <div class="sp-section"><div class="sp-label">Model</div><div class="sp-val hi">glm-4.5-flash</div></div>
    <div class="sp-section">
      <div class="sp-label">Context</div><div class="sp-val" id="ctx-val">12%</div>
      <div class="sp-meter"><div class="sp-meter-fill" id="ctx-fill" style="width:12%"></div></div>
    </div>
    <div class="sp-section"><div class="sp-label">Tokens</div><div class="sp-val" id="tok-val">0 in / 0 out</div></div>
    <div class="sp-section"><div class="sp-label">Tools</div><div class="sp-val" id="tool-ct">0</div></div>
    <div class="sp-head">Event Log</div>
    <div class="sp-log" id="sp-log"></div>
  </div>
</div>

<script>
const COLORS=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
let pi=0;const rc={};let toolCount=0;
function clr(id){if(!rc[id])rc[id]=COLORS[pi++%COLORS.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ts(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function sb(){document.querySelector('.stream-scroll').scrollTop=document.querySelector('.stream-scroll').scrollHeight;}

// Flame chart toggle
const flameWrap=document.getElementById('flame-wrap');
const flameToggle=document.getElementById('flame-toggle');
flameToggle.addEventListener('click',()=>{
  flameWrap.classList.toggle('collapsed');
  flameToggle.textContent=flameWrap.classList.contains('collapsed')?'▸ timeline':'▾ timeline';
});

// Flame chart
const flame=document.getElementById('flame');
function addBar(depth,startPct,widthPct,label,color,dur){
  const b=document.createElement('div');b.className='flame-bar bar-anim';
  b.style.cssText=`left:${startPct}%;width:${widthPct}%;background:${color}`;
  b.innerHTML=`${label}<span class="fb-dur">${dur||''}</span>`;
  let row=flame.querySelector(`[data-depth="${depth}"]`);
  if(!row){row=document.createElement('div');row.className='flame-row';row.dataset.depth=depth;flame.appendChild(row);}
  row.appendChild(b);
}

// Status panel
const spLog=document.getElementById('sp-log');
function logEvt(msg){const t=ts();spLog.innerHTML+=`<div class="sp-log-item"><span class="lts">${t}</span>${esc(msg)}</div>`;spLog.scrollTop=spLog.scrollHeight;}
function updCtx(p){document.getElementById('ctx-val').textContent=p+'%';const f=document.getElementById('ctx-fill');f.style.width=p+'%';f.style.background=p>70?'var(--amber)':p>50?'var(--rose)':'var(--lav)';}
function updTok(i,o){document.getElementById('tok-val').textContent=i.toLocaleString()+' in / '+o.toLocaleString()+' out';}
function updTools(){toolCount++;document.getElementById('tool-ct').textContent=toolCount;}

// Stream (flat timeline)
const stream=document.getElementById('stream');
function ev(dotColor,html,nest,noLine){
  const r=document.createElement('div');r.className='ev fi'+(nest?' n'+nest:'');
  r.innerHTML=`<div class="ev-ts">${ts()}</div><div class="ev-gut"><div class="ev-dot-w"><div class="ev-dot" style="background:${dotColor}"></div></div>${noLine?'':'<div class="ev-line"></div>'}</div><div class="ev-ct">${html}</div>`;
  stream.appendChild(r);sb();
}
function sepEv(t){ev('var(--text3)',`<div class="ev-sep">${esc(t)}</div>`,0,true);}
function userEv(t){ev('var(--lav)',`<div class="ev-user">${esc(t)}</div>`);}
function agentEv(id,name,sub,nest){const c=clr(id);ev(c,`<div class="ev-agent" style="color:${c}">▶ ${esc(name)} <span style="color:var(--text3)">${esc(sub||'')}</span></div>`,nest);logEvt(name+' started');}
function endEv(id,name,elapsed,nest){ev(rc[id],`<div class="ev-agent" style="color:${rc[id]}">■ ${esc(name)} <span style="color:var(--text3)">${esc(elapsed)}</span></div>`,nest);logEvt(`${name} done ${elapsed}`);}
function toolEv(id,name,args,state,nest){
  updTools();
  const ic=state==='done'?'<span class="sd">✓</span>':state==='error'?'<span class="se">✗</span>':'<span class="sr">●</span>';
  ev(rc[id],`<div class="ev-tool"><span class="tn" style="color:${rc[id]}">${esc(name)}</span><span class="ta">${esc(args)}</span>${ic}</div>`,nest);
  logEvt(`tool:${name} ${state}`);
}
function thinkEv(who,text){ev('var(--text3)',`<div class="ev-think">💭 ${esc(who)}: ${esc(text)}</div>`);}
function aiEv(html){ev('var(--lav)',`<div class="ev-ai">${html}</div>`,0,true);}
function errEv(msg){ev('var(--red)',`<div class="ev-err">⚠ ${esc(msg)}</div>`);logEvt('ERR: '+msg);}
function okEv(msg){ev('var(--green)',`<div class="ev-ok">✓ ${esc(msg)}</div>`,0,true);}
function skillEv(n,d){ev('var(--amber)',`<div class="ev-skill">⚡ ${esc(n)} ${esc(d)}</div>`);}

const gdot=document.getElementById('gdot');
const EVENTS=[
  {ms:500,fn(){sepEv('TURN 1');userEv('Refactor the auth module to use async/await, then run the tests.');gdot.className='tb-dot run';updCtx(12);updTok(800,0);}},
  {ms:300,fn(){addBar(0,0,25,'agent/refactor-auth',COLORS[0],'11.2s');agentEv('r1','agent','refactor-auth',0);}},
  {ms:280,fn(){toolEv('r1','read','"src/auth/mod.rs"','done',1);updCtx(15);updTok(1600,400);}},
  {ms:260,fn(){toolEv('r1','edit','"src/auth/mod.rs"','done',1);updTok(2400,1200);}},
  {ms:250,fn(){addBar(1,16,9,'sub/run-tests',COLORS[1],'3.8s');agentEv('r2','subagent','run-tests',1);}},
  {ms:350,fn(){toolEv('r2','bash','"cargo test --package auth"','done',2);updCtx(18);}},
  {ms:200,fn(){endEv('r2','subagent','3.8s',1);}},
  {ms:150,fn(){endEv('r1','agent','11.2s',0);gdot.className='tb-dot live';updCtx(24);updTok(3100,1800);}},
  {ms:350,fn(){aiEv('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){sepEv('TURN 2');userEv('Add rate limiting and deploy to staging.');gdot.className='tb-dot run';}},
  {ms:280,fn(){addBar(0,28,72,'agent/add-rate-limit',COLORS[2],'32.1s');agentEv('r3','agent','add-rate-limit',0);}},
  {ms:280,fn(){toolEv('r3','write','"src/middleware/rate_limit.rs"','done',1);updCtx(32);updTok(4200,2400);}},
  {ms:200,fn(){addBar(1,33,12,'sub/write-tests',COLORS[3],'5.1s');agentEv('r4','subagent','write-tests',1);}},
  {ms:300,fn(){toolEv('r4','bash','"cargo test rate_limit"','done',2);}},
  {ms:150,fn(){endEv('r4','subagent','5.1s',1);}},
  {ms:150,fn(){addBar(1,47,42,'sub/deploy-staging',COLORS[4],'18.4s');agentEv('r5','subagent','deploy-staging',1);}},
  {ms:400,fn(){toolEv('r5','bash','"./scripts/deploy.sh staging"','done',2);updCtx(40);}},
  {ms:200,fn(){endEv('r5','subagent','18.4s',1);}},
  {ms:150,fn(){endEv('r3','agent','32.1s',0);gdot.className='tb-dot live';updCtx(48);updTok(6200,3400);}},
  {ms:350,fn(){aiEv('Rate limiting added. Created <code>src/middleware/rate_limit.rs</code>. Deployed to staging — smoke tests passed.');}},
  {ms:700,fn(){sepEv('TURN 3');userEv('Audit all API endpoints for missing auth guards.');gdot.className='tb-dot run';}},
  {ms:280,fn(){agentEv('r6','agent','audit-auth-guards',0);}},
  {ms:300,fn(){toolEv('r6','find','"src/web/routes" *.rs','done',1);updCtx(52);}},
  {ms:300,fn(){toolEv('r6','bash','"rg -n auth_required src/web"','running',1);updCtx(55);}},
  {ms:800,fn(){thinkEv('agent/r6','Looking at 12 GET routes, 8 POST routes. Grepping for auth_required attribute.');}},
  {ms:400,fn(){skillEv('/skill:security-audit','OWASP checklist on routes');toolEv('r6','skill','/skill:security-audit','done',1);}},
  {ms:350,fn(){toolEv('r6','grep','"inject|sql|xss" routes/','done',1);updCtx(58);}},
  {ms:300,fn(){errEv('Rate limit hit on zai API — retrying in 2s');toolEv('r6','api','retry #1','running',1);}},
  {ms:500,fn(){toolEv('r6','api','retry #1','done',1);updCtx(62);updTok(9800,5200);}},
  {ms:200,fn(){endEv('r6','agent','22.7s',0);gdot.className='tb-dot live';}},
  {ms:300,fn(){okEv('Audit complete — 3 endpoints missing auth guards');aiEv('Found 3 endpoints in <code>src/web/routes/admin.rs</code> missing <code>#[auth_required]</code>: <code>GET /admin/users</code>, <code>POST /admin/ban</code>, <code>DELETE /admin/session</code>.');}},
];
let ei=0;function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);
const ta=document.querySelector('textarea');const btn=document.querySelector('button.send');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;userEv(t);ta.value='';ta.style.height='auto';});
</script>
</body>
</html>
