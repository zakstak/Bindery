<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Atelier</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0f0e13;--bg1:#14131a;--bg2:#1a1922;--bg3:#22212d;
  --border:#2a293a;--border2:#36354a;
  --text:#dcd8e8;--text2:#8a85a0;--text3:#5a566e;
  --lav:#a78bfa;--lav-dim:rgba(167,139,250,.1);--lav-glow:rgba(167,139,250,.25);
  --rose:#f472b6;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:8px;
}

html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;display:flex}

/* ═══ Left panel — session & nav ═══ */
.left{width:280px;min-width:280px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column}
.left-brand{padding:20px 22px 16px;display:flex;align-items:baseline;gap:10px}
.left-logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--lav),var(--rose));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
.left-ver{font-size:11px;color:var(--text3);font-family:'Fira Code',monospace}
.left-session{padding:0 22px 16px}
.sess-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 14px}
.sess-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:6px}
.sess-name{font-size:14px;font-weight:500;color:var(--text)}
.sess-meta{font-size:11px;color:var(--text2);margin-top:4px;font-family:'Fira Code',monospace}
.sess-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.sess-dot.run{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.3s infinite}
.sess-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.left-heading{padding:10px 22px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:600}
.ag-list{flex:1;overflow-y:auto;padding:0 10px 10px}
.ag-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:.15s;margin-bottom:2px}
.ag-item:hover{background:var(--bg2)}
.ag-item.active{background:var(--lav-dim);border:1px solid rgba(167,139,250,.2)}
.ag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ag-dot.run{animation:pulse 1.3s infinite}
.ag-info{flex:1;min-width:0}
.ag-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-sub{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace}
.ag-dur{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;flex-shrink:0}
.ag-item[data-d="1"]{margin-left:16px}
.ag-item[data-d="2"]{margin-left:32px}

/* ═══ Right — chat ═══ */
.right{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
/* subtle gradient behind chat */
.right::before{content:'';position:absolute;top:0;right:0;width:300px;height:300px;background:radial-gradient(circle,var(--lav-glow) 0%,transparent 70%);pointer-events:none;opacity:.3}

.chat-scroll{flex:1;overflow-y:auto;padding:16px 0 10px;position:relative;z-index:1}
.chat-inner{max-width:100%;margin:0;padding:0 20px;display:flex;flex-direction:column;gap:10px}

/* turn label */
.turn-label{display:flex;align-items:center;gap:12px;padding:4px 0}
.turn-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:3px 14px;font-size:11px;color:var(--text2);font-weight:500}
.turn-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}

.msg-user{align-self:flex-end;max-width:80%;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(244,114,182,.08));border:1px solid rgba(167,139,250,.2);border-radius:var(--r) var(--r) 4px var(--r);padding:10px 14px;font-size:13px;line-height:1.55}
.msg-ai{padding:2px 0;line-height:1.6;font-size:13px}
.msg-ai p+p{margin-top:6px}
.msg-ai code{font-family:'Fira Code',monospace;font-size:12px;background:var(--bg3);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--lav)}

/* run card */
.run-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.run-card:hover{border-color:var(--border2)}
.run-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;transition:.15s}
.run-head:hover{background:var(--bg2)}
.run-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.run-dot.run{animation:pulse 1.3s infinite}
.run-name{font-family:'Fira Code',monospace;font-size:12px;font-weight:500}
.run-sub{font-size:12px;color:var(--text3);font-weight:300}
.run-sp{flex:1}
.run-time{font-family:'Fira Code',monospace;font-size:10px;color:var(--text3)}
.run-chev{font-size:10px;color:var(--text3);transition:.2s}
.run-card.col .run-chev{transform:rotate(-90deg)}
.run-body{border-top:1px solid var(--border)}
.run-card.col .run-body{display:none}
.nested{margin:4px 10px 4px 16px;border-left:2px solid var(--border2);padding-left:10px}

.tool-row{display:flex;align-items:center;gap:7px;padding:5px 14px;font-family:'Fira Code',monospace;font-size:11px;color:var(--text2);transition:.1s}
.tool-row:hover{background:var(--bg2)}
.tool-name{flex-shrink:0}
.tool-args{color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-st{flex-shrink:0;font-size:10px}
.st-d{color:var(--green)}.st-r{color:var(--amber);animation:pulse 1.3s infinite}.st-e{color:var(--red)}

.think-bl{margin:4px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.think-hd{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-size:11px;color:var(--text3);user-select:none;font-family:'Fira Code',monospace}
.think-hd:hover{background:var(--bg3)}
.think-bd{padding:6px 10px;font-size:11px;color:var(--text3);line-height:1.6;white-space:pre-wrap;font-family:'Fira Code',monospace;border-top:1px solid var(--border)}
.think-bl.col .think-bd{display:none}

.skill-row{display:flex;align-items:center;gap:7px;padding:5px 14px;font-size:11px;font-family:'Fira Code',monospace;color:var(--text2);background:var(--lav-dim)}
.skill-badge{background:linear-gradient(135deg,var(--lav),var(--rose));color:#000;font-size:9px;padding:2px 8px;border-radius:99px;font-weight:600}
.err-row{display:flex;align-items:center;gap:7px;padding:5px 14px;font-size:11px;color:var(--red);background:rgba(251,113,133,.05)}
.notif-row{display:flex;align-items:center;gap:7px;padding:5px 14px;font-size:11px;color:var(--green)}

/* ═══ Input ═══ */
.input-wrap{border-top:1px solid var(--border);background:var(--bg1);padding:10px 20px;flex-shrink:0;position:relative;z-index:1}
.input-inner{max-width:100%;margin:0;display:flex;gap:10px;align-items:flex-end}
textarea.prompt{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:10px 14px;font-size:13px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:42px;max-height:160px;line-height:1.5;transition:border-color .2s}
textarea.prompt:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-dim)}
textarea.prompt::placeholder{color:var(--text3)}
button.send{background:linear-gradient(135deg,var(--lav),var(--rose));border:none;border-radius:var(--r);color:#fff;padding:10px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;flex-shrink:0;transition:.2s;letter-spacing:.01em}
button.send:hover{filter:brightness(1.15);transform:translateY(-1px)}

.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dotbounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dotbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi{animation:fadeUp .22s ease}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="left">
  <div class="left-brand">
    <span class="left-logo">Bindery</span>
    <span class="left-ver">v0.1</span>
  </div>
  <div class="left-session">
    <div class="sess-card">
      <div class="sess-label">Session</div>
      <div class="sess-name">Auth Module Refactor</div>
      <div class="sess-meta"><span class="sess-dot" id="gdot"></span> glm-4.5-flash</div>
    </div>
  </div>
  <div class="left-heading">Agents</div>
  <div class="ag-list" id="ag-list"></div>
</div>

<div class="right">
  <div class="chat-scroll"><div class="chat-inner" id="chat"></div></div>
  <div class="input-wrap"><div class="input-inner">
    <textarea class="prompt" placeholder="Write something…" rows="1"></textarea>
    <button class="send">Send</button>
  </div></div>
</div>

<script>
const PAL=['#a78bfa','#34d399','#f472b6','#fbbf24','#fb7185','#38bdf8','#a3e635','#fb923c'];
let pi=0;const rc={};
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function sb(){document.querySelector('.chat-scroll').scrollTop=document.querySelector('.chat-scroll').scrollHeight;}

const chat=document.getElementById('chat');
const agList=document.getElementById('ag-list');
const gdot=document.getElementById('gdot');
const runs={};

function agItem(id,name,sub,depth){
  const c=clr(id);
  const n=el('div','ag-item'+(depth===0?' active':''));
  n.dataset.d=depth;n.dataset.id=id;
  n.innerHTML=`<span class="ag-dot run" style="background:${c}"></span><div class="ag-info"><div class="ag-name" style="color:${c}">${esc(name)}</div><div class="ag-sub">${esc(sub||'')}</div></div><span class="ag-dur" id="ad-${id}"></span>`;
  agList.appendChild(n);
}
function endAg(id,elapsed){
  const n=agList.querySelector(`[data-id="${id}"]`);if(!n)return;
  n.querySelector('.ag-dot')?.classList.remove('run');
  const t=document.getElementById('ad-'+id);if(t&&elapsed)t.textContent=elapsed;
}

function turnLabel(text){
  const d=el('div','turn-label fi',`<span class="turn-pill">${text}</span><span class="turn-line"></span>`);
  chat.appendChild(d);
}
function userMsg(text){chat.appendChild(el('div','msg-user fi',esc(text)));sb();}
function aiMsg(html){const m=el('div','msg-ai fi');m.innerHTML=html;chat.appendChild(m);sb();}
function runBlock(id,name,sub,parentEl){
  const c=clr(id);
  const b=el('div','run-card fi');b.id='rb-'+id;
  b.innerHTML=`<div class="run-head"><span class="run-dot run" style="background:${c}"></span><span class="run-name" style="color:${c}">${esc(name)}</span>${sub?`<span class="run-sub">${esc(sub)}</span>`:''}<span class="run-sp"></span><span class="run-time" id="rt-${id}"></span><span class="run-chev">▾</span></div><div class="run-body" id="rbody-${id}"></div>`;
  b.querySelector('.run-head').addEventListener('click',()=>b.classList.toggle('col'));
  if(parentEl){const w=el('div','nested');w.appendChild(b);parentEl.appendChild(w);}
  else chat.appendChild(b);
  sb();return document.getElementById('rbody-'+id);
}
function endRun(id,elapsed){const b=document.getElementById('rb-'+id);if(!b)return;b.querySelector('.run-dot')?.classList.remove('run');const t=document.getElementById('rt-'+id);if(t&&elapsed)t.textContent=elapsed;}
function tool(id,name,args,state){
  const body=runs[id]?.body;if(!body)return;
  const ic=state==='done'?'✓':state==='error'?'✗':'●';
  const cls=state==='done'?'st-d':state==='error'?'st-e':'st-r';
  body.appendChild(el('div','tool-row fi',`<span class="tool-name" style="color:${clr(id)}">${esc(name)}</span><span class="tool-args">${esc(args)}</span><span class="tool-st ${cls}">${ic}</span>`));sb();
}
function think(who,text){const b=el('div','think-bl col fi');b.innerHTML=`<div class="think-hd"><span>▾</span> thinking… <span style="flex:1"></span><span>${esc(who)}</span></div><div class="think-bd">${esc(text)}</div>`;b.querySelector('.think-hd').addEventListener('click',()=>b.classList.toggle('col'));chat.appendChild(b);sb();}
function skillR(name,desc){chat.appendChild(el('div','skill-row fi',`<span class="skill-badge">skill</span>${esc(name)} <span style="color:var(--text3)">${esc(desc)}</span>`));sb();}
function errR(msg){chat.appendChild(el('div','err-row fi',`⚠ ${esc(msg)}`));sb();}
function notifR(msg){chat.appendChild(el('div','notif-row fi',`✓ ${esc(msg)}`));sb();}
function typing(){const t=el('div','msg-ai fi typing-ind','<span class="typing"><span></span><span></span><span></span></span>');chat.appendChild(t);sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){turnLabel('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');gdot.className='sess-dot run';}},
  {ms:300,fn(){agItem('r1','agent','refactor-auth',0);runs['r1']={body:runBlock('r1','agent','refactor-auth',null)};}},
  {ms:280,fn(){tool('r1','read','"src/auth/mod.rs"','done');}},
  {ms:260,fn(){tool('r1','edit','"src/auth/mod.rs"','done');}},
  {ms:250,fn(){agItem('r2','subagent','run-tests',1);runs['r2']={body:runBlock('r2','subagent','run-tests',runs['r1'].body)};}},
  {ms:350,fn(){tool('r2','bash','"cargo test --package auth"','done');}},
  {ms:200,fn(){endRun('r2','3.8s');endAg('r2','3.8s');}},
  {ms:150,fn(){endRun('r1','11.2s');endAg('r1','11.2s');gdot.className='sess-dot live';}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){turnLabel('Turn 2');userMsg('Add rate limiting and deploy to staging.');gdot.className='sess-dot run';}},
  {ms:280,fn(){agItem('r3','agent','add-rate-limit',0);runs['r3']={body:runBlock('r3','agent','add-rate-limit',null)};}},
  {ms:280,fn(){tool('r3','write','"src/middleware/rate_limit.rs"','done');}},
  {ms:200,fn(){agItem('r4','subagent','write-tests',1);runs['r4']={body:runBlock('r4','subagent','write-tests',runs['r3'].body)};}},
  {ms:300,fn(){tool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endRun('r4','5.1s');endAg('r4','5.1s');}},
  {ms:150,fn(){agItem('r5','subagent','deploy-staging',2);runs['r5']={body:runBlock('r5','subagent','deploy-staging',runs['r4'].body)};}},
  {ms:400,fn(){tool('r5','bash','"./scripts/deploy.sh staging"','done');}},
  {ms:200,fn(){endRun('r5','18.4s');endAg('r5','18.4s');}},
  {ms:150,fn(){endRun('r3','32.1s');endAg('r3','32.1s');gdot.className='sess-dot live';}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Created <code>src/middleware/rate_limit.rs</code>, registered as tower layer. Tests passed. Deployed to staging — smoke tests passed.');}},
  {ms:700,fn(){turnLabel('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');gdot.className='sess-dot run';}},
  {ms:280,fn(){agItem('r6','agent','audit-auth-guards',0);runs['r6']={body:runBlock('r6','agent','audit-auth-guards',null)};}},
  {ms:300,fn(){tool('r6','find','"src/web/routes" *.rs','done');}},
  {ms:300,fn(){tool('r6','bash','"rg -n auth_required src/web"','running');}},
  {ms:800,fn(){rmTyping();think('agent/r6','Looking at 12 GET routes, 8 POST routes. Grepping for auth_required attribute.');}},
  {ms:400,fn(){skillR('/skill:security-audit','OWASP checklist on routes');tool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){tool('r6','grep','"inject|sql|xss" routes/','done');}},
  {ms:300,fn(){errR('Rate limit hit on zai API — retrying in 2s');tool('r6','api','retry #1','running');}},
  {ms:500,fn(){tool('r6','api','retry #1','done');}},
  {ms:200,fn(){endRun('r6','22.7s');endAg('r6','22.7s');gdot.className='sess-dot live';}},
  {ms:300,fn(){notifR('Audit complete — 3 endpoints missing auth guards');rmTyping();aiMsg('Found 3 endpoints in <code>src/web/routes/admin.rs</code> missing <code>#[auth_required]</code>: <code>GET /admin/users</code>, <code>POST /admin/ban</code>, <code>DELETE /admin/session</code>.');typing();}},
];

let ei=0;
function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);

const ta=document.querySelector('textarea');const btn=document.querySelector('button.send');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';setTimeout(()=>typing(),150);});
</script>
</body>
</html>
