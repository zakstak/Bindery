<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;
  --border:#28243a;--border2:#342f4e;
  --text:#e0dced;--text2:#908ca5;--text3:#5c5878;
  --lav:#8b5cf6;--lav-dim:rgba(139,92,246,.10);
  --rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:4px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;flex-direction:column}

/* ─── Top bar ─── */
.topbar{height:34px;min-height:34px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.tb-logo{font-size:15px;font-weight:700;color:var(--lav)}
.tb-sep{width:1px;height:14px;background:var(--border2)}
.tb-label{font-size:10px;color:var(--text2)}
.tb-spacer{flex:1}
.tb-toggle{font-size:8px;color:var(--text3);cursor:pointer;padding:2px 7px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);transition:.15s;user-select:none}
.tb-toggle:hover{border-color:var(--lav);color:var(--text2)}
.tb-tag{font-size:9px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:1px 6px;border-radius:99px}
.tb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tb-dot.run{background:var(--amber);box-shadow:0 0 3px var(--amber);animation:pulse 1.3s infinite}
.tb-dot.live{background:var(--green)}

/* ─── Flame chart (collapsible, clickable) ─── */
.flame-wrap{background:var(--bg1);border-bottom:1px solid var(--border);overflow:hidden;padding:5px 14px;flex-shrink:0;transition:max-height .25s,padding .25s}
.flame-wrap.collapsed{max-height:0;padding:0 14px;border-bottom:none}
.flame-chart{position:relative;height:54px;overflow:hidden}
.flame-row{position:absolute;left:0;right:0}
.flame-row[data-depth="0"]{top:0;height:18px}
.flame-row[data-depth="1"]{top:19px;height:16px}
.flame-row[data-depth="2"]{top:36px;height:14px}
.flame-bar{position:absolute;height:100%;border-radius:2px;display:flex;align-items:center;padding:0 5px;font-family:'Fira Code',monospace;font-size:7px;font-weight:500;color:rgba(0,0,0,.8);overflow:hidden;white-space:nowrap;opacity:.75;cursor:pointer;transition:width .5s,opacity .15s}
.flame-bar:hover{opacity:1}
.flame-bar.sel{opacity:1;outline:1px solid #fff;outline-offset:-1px}
.flame-bar .fb-dur{margin-left:auto;padding-left:4px;opacity:.6}
.flame-axis{display:flex;justify-content:space-between;font-size:7px;color:var(--text3);font-family:'Fira Code',monospace;padding-top:1px}

/* ─── Main split: stream + right panel ─── */
.main-split{flex:1;display:flex;min-height:0}

/* Stream (flat timeline) */
.stream-col{flex:1;display:flex;flex-direction:column;min-width:0}
.stream-scroll{flex:1;overflow-y:auto;padding:5px 0}
.stream-inner{padding:0 14px;display:flex;flex-direction:column}

.ev{display:flex;align-items:flex-start;min-height:20px;cursor:default}
.ev.clickable{cursor:pointer}.ev.clickable:hover{background:var(--bg2)}
.ev.sel{background:rgba(139,92,246,.05)}
.ev-ts{width:56px;flex-shrink:0;font-family:'Fira Code',monospace;font-size:8px;color:var(--text3);padding-top:3px;text-align:right;padding-right:8px;user-select:none}
.ev-gut{width:18px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative}
.ev-dw{width:6px;height:6px;display:flex;align-items:center;justify-content:center;margin-top:5px;position:relative;z-index:1}
.ev-d{width:4px;height:4px;border-radius:50%}
.ev-ln{position:absolute;top:11px;bottom:-2px;width:1px;background:var(--border)}
.ev-ct{flex:1;min-width:0;padding:1px 0 2px;font-size:11px}
.ev.n1 .ev-gut{padding-left:10px}.ev.n2 .ev-gut{padding-left:20px}

.eu{font-weight:500;color:var(--text);display:inline-block;padding:2px 7px;background:rgba(139,92,246,.05);border:1px solid rgba(139,92,246,.1);border-radius:var(--r);font-size:11px}
.ea{font-family:'Fira Code',monospace;font-size:10px;font-weight:500}
.et{font-family:'Fira Code',monospace;font-size:9px;color:var(--text2);display:flex;align-items:center;gap:3px}
.et .tn{flex-shrink:0}.et .ta{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et .sd{color:var(--green);font-size:8px}.et .sr{color:var(--amber);font-size:8px}.et .se{color:var(--red);font-size:8px}
.eth{font-size:9px;color:var(--text3);font-style:italic;font-family:'Fira Code',monospace}
.eai{font-size:11px;line-height:1.5}
.eai code{font-family:'Fira Code',monospace;font-size:9px;background:var(--bg3);border:1px solid var(--border);padding:1px 3px;border-radius:2px;color:var(--lav)}
.eer{font-size:9px;color:var(--red)}
.eok{font-size:9px;color:var(--green)}
.esk{font-size:9px;color:var(--amber);font-family:'Fira Code',monospace}
.esp{font-size:8px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 0}

/* ─── Right panel: inspector + metrics ─── */
.right-panel{width:200px;min-width:200px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;font-family:'Fira Code',monospace;font-size:10px;overflow-y:auto}
.rp-head{padding:5px 10px;font-size:7px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg1);z-index:1}
.rp-section{padding:5px 10px;border-bottom:1px solid var(--border)}
.rp-label{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.rp-val{font-size:9px;color:var(--text2)}
.rp-val.hi{color:var(--lav)}
.rp-meter{height:2px;background:var(--bg3);border-radius:1px;margin-top:3px;overflow:hidden}
.rp-meter-fill{height:100%;border-radius:1px;transition:width .5s;background:var(--lav)}

/* Inspector content */
.insp-content{display:none;flex-direction:column}
.insp-content.active{display:flex}
.insp-hdr{padding:6px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.insp-dot{width:7px;height:7px;border-radius:50%}
.insp-name{font-size:10px;font-weight:600}
.insp-sub{font-size:9px;color:var(--text3)}
.insp-sp{flex:1}
.insp-dur{font-size:9px;color:var(--text3)}
.insp-stat{font-size:7px;padding:1px 5px;border-radius:99px;font-weight:500}
.insp-stat.done{background:rgba(52,211,153,.08);color:var(--green);border:1px solid rgba(52,211,153,.15)}
.insp-stat.running{background:rgba(251,191,36,.08);color:var(--amber);border:1px solid rgba(251,191,36,.15)}
.isec{padding:5px 10px;font-size:7px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600;border-top:1px solid var(--border)}
.itool{display:flex;align-items:center;gap:3px;padding:2px 10px;font-size:9px;color:var(--text2)}
.itool:hover{background:var(--bg2)}
.itn{flex-shrink:0}.ita{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.its{font-size:8px}.its-d{color:var(--green)}.its-r{color:var(--amber)}.its-e{color:var(--red)}
.ichild{display:flex;align-items:center;gap:4px;padding:3px 10px;font-size:9px;color:var(--text2);cursor:pointer;transition:.1s}
.ichild:hover{color:var(--lav);background:var(--bg2)}
.icd{width:4px;height:4px;border-radius:50%}
.ierr{padding:2px 10px;font-size:8px;color:var(--red)}
.iskill{padding:2px 10px;font-size:8px;color:var(--amber)}

/* Event log */
.rp-log{flex:1;overflow-y:auto;padding:1px 0}
.rp-log-item{padding:1px 10px;font-size:6px;color:var(--text3)}

/* ─── Input ─── */
.input-wrap{border-top:1px solid var(--border);background:var(--bg1);padding:7px 14px;flex-shrink:0}
.input-inner{display:flex;gap:6px;align-items:flex-end}
textarea.prompt{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:6px 9px;font-size:11px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:30px;max-height:100px;line-height:1.5;transition:.15s}
textarea.prompt:focus{border-color:var(--lav)}
textarea.prompt::placeholder{color:var(--text3)}
button.send{background:var(--lav);border:none;border-radius:var(--r);color:#fff;padding:6px 14px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:.15s}
button.send:hover{filter:brightness(1.15)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.fi{animation:fadeIn .12s ease}
@keyframes growBar{from{width:0!important}}
.bar-anim{animation:growBar .4s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Bindery</span><div class="tb-sep"></div>
  <span class="tb-label">Auth Module Refactor</span><span class="tb-spacer"></span>
  <span class="tb-toggle" id="ft">▾ timeline</span><div class="tb-sep"></div>
  <span class="tb-tag">glm-4.5-flash</span>
  <div class="tb-dot" id="gdot"></div>
</div>

<div class="flame-wrap" id="fw">
  <div class="flame-chart" id="flame"></div>
  <div class="flame-axis"><span>0s</span><span>10s</span><span>20s</span><span>30s</span><span>40s</span></div>
</div>

<div class="main-split">
  <div class="stream-col">
    <div class="stream-scroll"><div class="stream-inner" id="stream"></div></div>
    <div class="input-wrap"><div class="input-inner">
      <textarea class="prompt" placeholder="Write something…" rows="1"></textarea>
      <button class="send">Send</button>
    </div></div>
  </div>

  <div class="right-panel" id="rpanel">
    <div class="rp-head">Status</div>
    <div class="rp-section"><div class="rp-label">Model</div><div class="rp-val hi">glm-4.5-flash</div></div>
    <div class="rp-section"><div class="rp-label">Context</div><div class="rp-val" id="ctx-val">12%</div><div class="rp-meter"><div class="rp-meter-fill" id="ctx-fill" style="width:12%"></div></div></div>
    <div class="rp-section"><div class="rp-label">Tokens</div><div class="rp-val" id="tok-val">0 in / 0 out</div></div>
    <div class="rp-section"><div class="rp-label">Tools</div><div class="rp-val" id="tool-ct">0</div></div>
    <div class="insp-content" id="insp"></div>
    <div class="rp-head">Log</div>
    <div class="rp-log" id="rp-log"></div>
  </div>
</div>

<script>
const PAL=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
let pi=0;const rc={};let toolCount=0;
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ts(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function sb(){document.querySelector('.stream-scroll').scrollTop=document.querySelector('.stream-scroll').scrollHeight;}

// Flame toggle
document.getElementById('ft').addEventListener('click',()=>{
  const w=document.getElementById('fw');w.classList.toggle('collapsed');
  document.getElementById('ft').textContent=w.classList.contains('collapsed')?'▸ timeline':'▾ timeline';
});

// Flame chart
const flame=document.getElementById('flame');
const bars={};// id -> bar element
function addBar(id,depth,startPct,widthPct,label,color,dur){
  const b=document.createElement('div');b.className='flame-bar bar-anim';b.dataset.id=id;
  b.style.cssText=`left:${startPct}%;width:${widthPct}%;background:${color}`;
  b.innerHTML=`${label}<span class="fb-dur">${dur||''}</span>`;
  b.addEventListener('click',()=>selectAgent(id));
  let row=flame.querySelector(`[data-depth="${depth}"]`);
  if(!row){row=document.createElement('div');row.className='flame-row';row.dataset.depth=depth;flame.appendChild(row);}
  row.appendChild(b);bars[id]=b;
}

// Status panel
const rpLog=document.getElementById('rp-log');
function logEvt(msg){rpLog.innerHTML+=`<div class="rp-log-item">${ts()} ${esc(msg)}</div>`;rpLog.scrollTop=rpLog.scrollHeight;}
function updCtx(p){document.getElementById('ctx-val').textContent=p+'%';const f=document.getElementById('ctx-fill');f.style.width=p+'%';f.style.background=p>70?'var(--amber)':p>50?'var(--rose)':'var(--lav)';}
function updTok(i,o){document.getElementById('tok-val').textContent=i.toLocaleString()+' in / '+o.toLocaleString()+' out';}
function updTools(){toolCount++;document.getElementById('tool-ct').textContent=toolCount;}

// Agent data store
const agents={};
let selectedId=null;

function regAgent(id,name,sub,parentId){
  const c=clr(id);
  agents[id]={name,sub,color:c,tools:[],children:[],errors:[],skills:[],elapsed:null,status:'running'};
  if(parentId&&agents[parentId])agents[parentId].children.push(id);
}
function endA(id,elapsed){agents[id].elapsed=elapsed;agents[id].status='done';if(selectedId===id)showInspector(id);}
function addToolData(id,n,a,s){agents[id].tools.push({n,a,s});if(selectedId===id)showInspector(id);}
function addErrData(id,m){agents[id].errors.push(m);if(selectedId===id)showInspector(id);}
function addSkillData(id,s){agents[id].skills.push(s);if(selectedId===id)showInspector(id);}

function selectAgent(id){
  selectedId=id;
  // Highlight flame bar
  document.querySelectorAll('.flame-bar').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  // Highlight stream events
  document.querySelectorAll('.ev').forEach(e=>e.classList.toggle('sel',e.dataset.agent===id));
  showInspector(id);
}

function showInspector(id){
  const a=agents[id];if(!a)return;
  const insp=document.getElementById('insp');
  insp.className='insp-content active';
  const st=a.status;
  let h=`<div class="rp-head">Agent</div><div class="insp-hdr"><span class="insp-dot" style="background:${a.color}"></span><span class="insp-name" style="color:${a.color}">${esc(a.name)}</span><span class="insp-sub">${esc(a.sub||'')}</span><span class="insp-sp"></span>${a.elapsed?`<span class="insp-dur">${a.elapsed}</span>`:''}<span class="insp-stat ${st}">${st}</span></div>`;
  if(a.tools.length){
    h+=`<div class="isec">Tools (${a.tools.length})</div>`;
    a.tools.forEach(t=>{const ic=t.s==='done'?'✓':t.s==='error'?'✗':'●';const c=t.s==='done'?'its-d':t.s==='error'?'its-e':'its-r';h+=`<div class="itool"><span class="itn" style="color:${a.color}">${esc(t.n)}</span><span class="ita">${esc(t.a)}</span><span class="its ${c}">${ic}</span></div>`;});
  }
  if(a.children.length){
    h+=`<div class="isec">Sub-agents</div>`;
    a.children.forEach(cid=>{const ca=agents[cid];if(!ca)return;h+=`<div class="ichild" onclick="selectAgent('${cid}')"><span class="icd" style="background:${ca.color}"></span>${esc(ca.name)} / ${esc(ca.sub||'')} <span style="margin-left:auto;color:var(--text3)">${ca.elapsed||'…'}</span></div>`;});
  }
  if(a.errors.length)a.errors.forEach(e=>{h+=`<div class="ierr">⚠ ${esc(e)}</div>`;});
  if(a.skills.length)a.skills.forEach(s=>{h+=`<div class="iskill">⚡ ${esc(s)}</div>`;});
  insp.innerHTML=h;
}

// Stream
const stream=document.getElementById('stream');
function ev(dotColor,html,nest,noLine,agentId,clickable){
  const r=document.createElement('div');
  r.className='ev fi'+(nest?' n'+nest:'')+(clickable?' clickable':'');
  if(agentId)r.dataset.agent=agentId;
  if(clickable&&agentId)r.addEventListener('click',()=>selectAgent(agentId));
  r.innerHTML=`<div class="ev-ts">${ts()}</div><div class="ev-gut"><div class="ev-dw"><div class="ev-d" style="background:${dotColor}"></div></div>${noLine?'':'<div class="ev-ln"></div>'}</div><div class="ev-ct">${html}</div>`;
  stream.appendChild(r);sb();
}
function sepEv(t){ev('var(--text3)',`<div class="esp">${esc(t)}</div>`,0,true);}
function userEv(t){ev('var(--lav)',`<div class="eu">${esc(t)}</div>`);}
function agentEv(id,name,sub,nest){const c=rc[id];ev(c,`<div class="ea" style="color:${c}">▶ ${esc(name)} <span style="color:var(--text3)">${esc(sub||'')}</span></div>`,nest,false,id,true);logEvt(name+' started');}
function endEv(id,name,elapsed,nest){ev(rc[id],`<div class="ea" style="color:${rc[id]}">■ ${esc(name)} <span style="color:var(--text3)">${esc(elapsed)}</span></div>`,nest,false,id,true);logEvt(`${name} done ${elapsed}`);}
function toolEv(id,name,args,state,nest){
  updTools();
  const ic=state==='done'?'<span class="sd">✓</span>':state==='error'?'<span class="se">✗</span>':'<span class="sr">●</span>';
  ev(rc[id],`<div class="et"><span class="tn" style="color:${rc[id]}">${esc(name)}</span><span class="ta">${esc(args)}</span>${ic}</div>`,nest,false,id,true);
  logEvt(`tool:${name} ${state}`);
}
function thinkEv(who,text){ev('var(--text3)',`<div class="eth">💭 ${esc(who)}: ${esc(text)}</div>`);}
function aiEv(html){ev('var(--lav)',`<div class="eai">${html}</div>`,0,true);}
function errEv(id,msg){ev('var(--red)',`<div class="eer">⚠ ${esc(msg)}</div>`,0,false,id);logEvt('ERR: '+msg);}
function okEv(msg){ev('var(--green)',`<div class="eok">✓ ${esc(msg)}</div>`,0,true);}
function skillEv(id,n,d){ev('var(--amber)',`<div class="esk">⚡ ${esc(n)} ${esc(d)}</div>`,0,false,id);}

const gdot=document.getElementById('gdot');
const EVENTS=[
  {ms:500,fn(){sepEv('TURN 1');userEv('Refactor the auth module to use async/await, then run the tests.');gdot.className='tb-dot run';updCtx(12);updTok(800,0);}},
  {ms:300,fn(){regAgent('r1','agent','refactor-auth');addBar('r1',0,0,25,'agent/refactor-auth',rc['r1'],'11.2s');agentEv('r1','agent','refactor-auth',0);}},
  {ms:280,fn(){addToolData('r1','read','"src/auth/mod.rs"','done');toolEv('r1','read','"src/auth/mod.rs"','done',1);updCtx(15);updTok(1600,400);}},
  {ms:260,fn(){addToolData('r1','edit','"src/auth/mod.rs"','done');toolEv('r1','edit','"src/auth/mod.rs"','done',1);updTok(2400,1200);}},
  {ms:250,fn(){regAgent('r2','subagent','run-tests','r1');addBar('r2',1,16,9,'sub/run-tests',rc['r2'],'3.8s');agentEv('r2','subagent','run-tests',1);}},
  {ms:350,fn(){addToolData('r2','bash','"cargo test --package auth"','done');toolEv('r2','bash','"cargo test --package auth"','done',2);updCtx(18);}},
  {ms:200,fn(){endA('r2','3.8s');endEv('r2','subagent','3.8s',1);}},
  {ms:150,fn(){endA('r1','11.2s');endEv('r1','agent','11.2s',0);gdot.className='tb-dot live';updCtx(24);updTok(3100,1800);}},
  {ms:350,fn(){aiEv('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){sepEv('TURN 2');userEv('Add rate limiting and deploy to staging.');gdot.className='tb-dot run';}},
  {ms:280,fn(){regAgent('r3','agent','add-rate-limit');addBar('r3',0,28,72,'agent/add-rate-limit',rc['r3'],'32.1s');agentEv('r3','agent','add-rate-limit',0);}},
  {ms:280,fn(){addToolData('r3','write','"src/middleware/rate_limit.rs"','done');toolEv('r3','write','"src/middleware/rate_limit.rs"','done',1);updCtx(32);updTok(4200,2400);}},
  {ms:200,fn(){regAgent('r4','subagent','write-tests','r3');addBar('r4',1,33,12,'sub/write-tests',rc['r4'],'5.1s');agentEv('r4','subagent','write-tests',1);}},
  {ms:300,fn(){addToolData('r4','bash','"cargo test rate_limit"','done');toolEv('r4','bash','"cargo test rate_limit"','done',2);}},
  {ms:150,fn(){endA('r4','5.1s');endEv('r4','subagent','5.1s',1);}},
  {ms:150,fn(){regAgent('r5','subagent','deploy-staging','r3');addBar('r5',1,47,42,'sub/deploy-staging',rc['r5'],'18.4s');agentEv('r5','subagent','deploy-staging',1);}},
  {ms:400,fn(){addToolData('r5','bash','"./scripts/deploy.sh staging"','done');toolEv('r5','bash','"./scripts/deploy.sh staging"','done',2);updCtx(40);}},
  {ms:200,fn(){endA('r5','18.4s');endEv('r5','subagent','18.4s',1);}},
