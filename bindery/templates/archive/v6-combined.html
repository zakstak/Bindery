<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;
  --border:#28243a;--border2:#342f4e;
  --text:#e0dced;--text2:#908ca5;--text3:#5c5878;
  --lav:#8b5cf6;--lav-dim:rgba(139,92,246,.10);--lav-glow:rgba(139,92,246,.15);
  --rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:6px;
}

html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex}

/* ═══ Top bar ═══ */
.topbar{height:40px;min-height:40px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.tb-logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--lav),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
.tb-sep{width:1px;height:18px;background:var(--border2)}
.tb-session{font-size:12px;font-weight:500;color:var(--text2)}
.tb-model{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:2px 8px;border-radius:99px}
.tb-spacer{flex:1}
.tb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tb-dot.run{background:var(--amber);box-shadow:0 0 4px var(--amber);animation:pulse 1.3s infinite}
.tb-dot.live{background:var(--green);box-shadow:0 0 3px var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ Main area ═══ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content-split{flex:1;display:flex;min-height:0;position:relative}
.content-split::before{content:'';position:absolute;top:0;right:200px;width:250px;height:250px;background:radial-gradient(circle,var(--lav-glow) 0%,transparent 70%);pointer-events:none;opacity:.1}
.chat-col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}

.chat-scroll{flex:1;overflow-y:auto;padding:12px 0 8px;position:relative;z-index:1}
.chat-inner{padding:0 16px;display:flex;flex-direction:column;gap:8px}

.turn-label{display:flex;align-items:center;gap:10px;padding:3px 0}
.turn-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:2px 12px;font-size:10px;color:var(--text2);font-weight:500}
.turn-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}

.msg-user{align-self:flex-end;max-width:80%;background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(244,114,182,.08));border:1px solid rgba(167,139,250,.2);border-radius:var(--r) var(--r) 3px var(--r);padding:8px 12px;font-size:13px;line-height:1.5}
.msg-ai{padding:2px 0;line-height:1.55;font-size:13px}
.msg-ai p+p{margin-top:5px}
.msg-ai code{font-family:'Fira Code',monospace;font-size:11px;background:var(--bg3);border:1px solid var(--border);padding:1px 5px;border-radius:3px;color:var(--lav)}

/* run card */
.run-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.run-card:hover{border-color:var(--border2)}
.run-head{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;user-select:none;transition:.15s}
.run-head:hover{background:var(--bg2)}
.run-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.run-dot.run{animation:pulse 1.3s infinite}
.run-name{font-family:'Fira Code',monospace;font-size:11px;font-weight:500}
.run-sub{font-size:11px;color:var(--text3);font-weight:300}
.run-sp{flex:1}
.run-time{font-family:'Fira Code',monospace;font-size:9px;color:var(--text3)}
.run-chev{font-size:9px;color:var(--text3);transition:.2s}
.run-card.col .run-chev{transform:rotate(-90deg)}
.run-body{border-top:1px solid var(--border)}
.run-card.col .run-body{display:none}
.nested{margin:3px 8px 3px 12px;border-left:2px solid var(--border2);padding-left:8px}

.tool-row{display:flex;align-items:center;gap:6px;padding:3px 10px;font-family:'Fira Code',monospace;font-size:10px;color:var(--text2);transition:.1s}
.tool-row:hover{background:var(--bg2)}
.tool-name{flex-shrink:0}
.tool-args{color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-st{flex-shrink:0;font-size:9px}
.st-d{color:var(--green)}.st-r{color:var(--amber);animation:pulse 1.3s infinite}.st-e{color:var(--red)}

.think-bl{margin:3px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.think-hd{display:flex;align-items:center;gap:5px;padding:4px 8px;cursor:pointer;font-size:10px;color:var(--text3);user-select:none;font-family:'Fira Code',monospace}
.think-hd:hover{background:var(--bg3)}
.think-bd{padding:4px 8px;font-size:10px;color:var(--text3);line-height:1.5;white-space:pre-wrap;font-family:'Fira Code',monospace;border-top:1px solid var(--border)}
.think-bl.col .think-bd{display:none}

.skill-row{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:10px;font-family:'Fira Code',monospace;color:var(--text2);background:var(--lav-dim)}
.skill-badge{background:linear-gradient(135deg,var(--lav),var(--rose));color:#000;font-size:8px;padding:1px 6px;border-radius:99px;font-weight:600}
.err-row{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:10px;color:var(--red);background:rgba(251,113,133,.05)}
.notif-row{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:10px;color:var(--green)}

/* ═══ Input ═══ */
.input-wrap{border-top:1px solid var(--border);background:var(--bg1);padding:10px 16px;flex-shrink:0;position:relative;z-index:1}
.input-inner{display:flex;gap:8px;align-items:flex-end}
textarea.prompt{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:8px 12px;font-size:12px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:36px;max-height:140px;line-height:1.5;transition:border-color .2s}
textarea.prompt:focus{border-color:var(--lav);box-shadow:0 0 0 3px var(--lav-dim)}
textarea.prompt::placeholder{color:var(--text3)}
button.send{background:linear-gradient(135deg,var(--lav),var(--rose));border:none;border-radius:var(--r);color:#fff;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;flex-shrink:0;transition:.2s}
button.send:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* ═══ Right — status panel (from V4) ═══ */
.status-panel{width:200px;min-width:200px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;font-family:'Fira Code',monospace}
.sp-head{padding:8px 12px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);border-bottom:1px solid var(--border)}
.sp-section{padding:8px 12px;border-bottom:1px solid var(--border)}
.sp-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.sp-val{font-size:11px;color:var(--text2)}
.sp-val.hi{color:var(--lav)}
.sp-meter{height:3px;background:var(--bg3);border-radius:2px;margin-top:5px;overflow:hidden}
.sp-meter-fill{height:100%;border-radius:2px;transition:width .5s;background:var(--lav)}
.sp-log{flex:1;overflow-y:auto;padding:4px 0}
.sp-log-item{padding:1px 12px;font-size:8px;color:var(--text3)}
.sp-log-item .ts{color:var(--text3);margin-right:5px}

.typing span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dotbounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dotbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fi{animation:fadeUp .2s ease}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="main">
  <div class="topbar">
    <span class="tb-logo">Bindery</span>
    <div class="tb-sep"></div>
    <span class="tb-session">Auth Module Refactor</span>
    <span class="tb-spacer"></span>
    <span class="tb-model">glm-4.5-flash</span>
    <div class="tb-dot" id="gdot"></div>
  </div>
  <div class="content-split">
    <div class="chat-col">
      <div class="chat-scroll"><div class="chat-inner" id="chat"></div></div>
      <div class="input-wrap"><div class="input-inner">
        <textarea class="prompt" placeholder="Write something…" rows="1"></textarea>
        <button class="send">Send</button>
      </div></div>
    </div>

    <div class="status-panel">
  <div class="sp-head">Status</div>
  <div class="sp-section"><div class="sp-label">Model</div><div class="sp-val hi">glm-4.5-flash</div></div>
  <div class="sp-section">
    <div class="sp-label">Context</div><div class="sp-val" id="ctx-val">12%</div>
    <div class="sp-meter"><div class="sp-meter-fill" id="ctx-fill" style="width:12%"></div></div>
  </div>
  <div class="sp-section"><div class="sp-label">Tokens</div><div class="sp-val" id="tok-val">0 in / 0 out</div></div>
  <div class="sp-section">
    <div class="sp-label">Tools</div><div class="sp-val" id="tool-ct-val">0</div>
  </div>
  <div class="sp-head">Event Log</div>
  <div class="sp-log" id="sp-log"></div>
</div>
  </div><!-- content-split -->
</div><!-- main -->

<script>
const PAL=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8','#a3e635','#fb923c'];
let pi=0;const rc={};
let toolCount=0;
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function sb(){document.querySelector('.chat-scroll').scrollTop=document.querySelector('.chat-scroll').scrollHeight;}

const chat=document.getElementById('chat');
const gdot=document.getElementById('gdot');
const spLog=document.getElementById('sp-log');
const runs={};

function logEvt(msg){
  const now=new Date();const ts=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  spLog.appendChild(el('div','sp-log-item',`<span class="ts">${ts}</span>${esc(msg)}`));
  spLog.scrollTop=spLog.scrollHeight;
}
function updCtx(pct){
  document.getElementById('ctx-val').textContent=pct+'%';
  const fill=document.getElementById('ctx-fill');fill.style.width=pct+'%';
  if(pct>70)fill.style.background='var(--amber)';
  else if(pct>50)fill.style.background='var(--rose)';
  else fill.style.background='var(--lav)';
}
function updTok(i,o){document.getElementById('tok-val').textContent=i.toLocaleString()+' in / '+o.toLocaleString()+' out';}
function updTools(){toolCount++;document.getElementById('tool-ct-val').textContent=toolCount;}

function turnLabel(text){chat.appendChild(el('div','turn-label fi',`<span class="turn-pill">${text}</span><span class="turn-line"></span>`));}
function userMsg(text){chat.appendChild(el('div','msg-user fi',esc(text)));sb();}
function aiMsg(html){const m=el('div','msg-ai fi');m.innerHTML=html;chat.appendChild(m);sb();}
function runBlock(id,name,sub,parentEl){
  const c=clr(id);
  const b=el('div','run-card fi');b.id='rb-'+id;
  b.innerHTML=`<div class="run-head"><span class="run-dot run" style="background:${c}"></span><span class="run-name" style="color:${c}">${esc(name)}</span>${sub?`<span class="run-sub">${esc(sub)}</span>`:''}<span class="run-sp"></span><span class="run-time" id="rt-${id}"></span><span class="run-chev">▾</span></div><div class="run-body" id="rbody-${id}"></div>`;
  b.querySelector('.run-head').addEventListener('click',()=>b.classList.toggle('col'));
  if(parentEl){const w=el('div','nested');w.appendChild(b);parentEl.appendChild(w);}
  else chat.appendChild(b);
  sb();return document.getElementById('rbody-'+id);
}
function endRun(id,elapsed){const b=document.getElementById('rb-'+id);if(!b)return;b.querySelector('.run-dot')?.classList.remove('run');const t=document.getElementById('rt-'+id);if(t&&elapsed)t.textContent=elapsed;logEvt(`${id} done ${elapsed}`);}
function tool(id,name,args,state){
  const body=runs[id]?.body;if(!body)return;
  updTools();
  const ic=state==='done'?'✓':state==='error'?'✗':'●';
  const cls=state==='done'?'st-d':state==='error'?'st-e':'st-r';
  body.appendChild(el('div','tool-row fi',`<span class="tool-name" style="color:${clr(id)}">${esc(name)}</span><span class="tool-args">${esc(args)}</span><span class="tool-st ${cls}">${ic}</span>`));sb();
  logEvt(`tool:${name} ${state}`);
}
function think(who,text){const b=el('div','think-bl col fi');b.innerHTML=`<div class="think-hd"><span>▾</span> thinking… <span style="flex:1"></span><span>${esc(who)}</span></div><div class="think-bd">${esc(text)}</div>`;b.querySelector('.think-hd').addEventListener('click',()=>b.classList.toggle('col'));chat.appendChild(b);sb();}
function skillR(name,desc){chat.appendChild(el('div','skill-row fi',`<span class="skill-badge">skill</span>${esc(name)} <span style="color:var(--text3)">${esc(desc)}</span>`));sb();}
function errR(msg){chat.appendChild(el('div','err-row fi',`⚠ ${esc(msg)}`));sb();logEvt('ERR: '+msg);}
function notifR(msg){chat.appendChild(el('div','notif-row fi',`✓ ${esc(msg)}`));sb();}
function typing(){const t=el('div','msg-ai fi typing-ind','<span class="typing"><span></span><span></span><span></span></span>');chat.appendChild(t);sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){turnLabel('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');gdot.className='tb-dot run';updCtx(12);updTok(800,0);}},
  {ms:300,fn(){runs['r1']={body:runBlock('r1','agent','refactor-auth',null)};}},
  {ms:280,fn(){tool('r1','read','"src/auth/mod.rs"','done');updCtx(15);updTok(1600,400);}},
  {ms:260,fn(){tool('r1','edit','"src/auth/mod.rs"','done');updTok(2400,1200);}},
  {ms:250,fn(){runs['r2']={body:runBlock('r2','subagent','run-tests',runs['r1'].body)};}},
  {ms:350,fn(){tool('r2','bash','"cargo test --package auth"','done');updCtx(18);}},
  {ms:200,fn(){endRun('r2','3.8s');}},
  {ms:150,fn(){endRun('r1','11.2s');gdot.className='tb-dot live';updCtx(24);updTok(3100,1800);}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){turnLabel('Turn 2');userMsg('Add rate limiting and deploy to staging.');gdot.className='tb-dot run';}},
  {ms:280,fn(){runs['r3']={body:runBlock('r3','agent','add-rate-limit',null)};}},
  {ms:280,fn(){tool('r3','write','"src/middleware/rate_limit.rs"','done');updCtx(32);updTok(4200,2400);}},
  {ms:200,fn(){runs['r4']={body:runBlock('r4','subagent','write-tests',runs['r3'].body)};}},
  {ms:300,fn(){tool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endRun('r4','5.1s');}},
  {ms:150,fn(){runs['r5']={body:runBlock('r5','subagent','deploy-staging',runs['r4'].body)};}},
  {ms:400,fn(){tool('r5','bash','"./scripts/deploy.sh staging"','done');updCtx(40);}},
  {ms:200,fn(){endRun('r5','18.4s');}},
  {ms:150,fn(){endRun('r3','32.1s');gdot.className='tb-dot live';updCtx(48);updTok(6200,3400);}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Created <code>src/middleware/rate_limit.rs</code>, registered as tower layer. Tests passed. Deployed to staging — smoke tests passed.');}},
  {ms:700,fn(){turnLabel('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');gdot.className='tb-dot run';}},
  {ms:280,fn(){runs['r6']={body:runBlock('r6','agent','audit-auth-guards',null)};}},
  {ms:300,fn(){tool('r6','find','"src/web/routes" *.rs','done');updCtx(52);}},
  {ms:300,fn(){tool('r6','bash','"rg -n auth_required src/web"','running');updCtx(55);}},
  {ms:800,fn(){rmTyping();think('agent/r6','Looking at 12 GET routes, 8 POST routes. Grepping for auth_required attribute.');}},
  {ms:400,fn(){skillR('/skill:security-audit','OWASP checklist on routes');tool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){tool('r6','grep','"inject|sql|xss" routes/','done');updCtx(58);}},
  {ms:300,fn(){errR('Rate limit hit on zai API — retrying in 2s');tool('r6','api','retry #1','running');}},
  {ms:500,fn(){tool('r6','api','retry #1','done');updCtx(62);updTok(9800,5200);}},
  {ms:200,fn(){endRun('r6','22.7s');gdot.className='tb-dot live';}},
  {ms:300,fn(){notifR('Audit complete — 3 endpoints missing auth guards');rmTyping();aiMsg('Found 3 endpoints in <code>src/web/routes/admin.rs</code> missing <code>#[auth_required]</code>: <code>GET /admin/users</code>, <code>POST /admin/ban</code>, <code>DELETE /admin/session</code>.');typing();}},
];

let ei=0;
function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);

const ta=document.querySelector('textarea');const btn=document.querySelector('button.send');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';setTimeout(()=>typing(),150);});
</script>
</body>
</html>
