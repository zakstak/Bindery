<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Inspector</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;
  --border:#28243a;--border2:#342f4e;
  --text:#e0dced;--text2:#908ca5;--text3:#5c5878;
  --lav:#8b5cf6;--lav-dim:rgba(139,92,246,.10);
  --rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:4px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;flex-direction:column}

/* Top bar */
.topbar{height:36px;min-height:36px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-logo{font-size:16px;font-weight:700;color:var(--lav)}
.tb-sep{width:1px;height:16px;background:var(--border2)}
.tb-label{font-size:11px;color:var(--text2)}
.tb-spacer{flex:1}
.tb-tag{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:1px 7px;border-radius:99px}
.tb-toggle{font-size:9px;color:var(--text3);cursor:pointer;padding:2px 8px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);transition:.15s;user-select:none}
.tb-toggle:hover{border-color:var(--lav);color:var(--text2)}

/* Flame chart (collapsible) */
.flame-wrap{background:var(--bg1);border-bottom:1px solid var(--border);overflow:hidden;padding:6px 16px;flex-shrink:0;transition:max-height .3s,padding .3s}
.flame-wrap.collapsed{max-height:0;padding:0 16px;border-bottom:none}
.flame-header{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px;font-weight:600}
.flame-chart{position:relative;height:56px;overflow:hidden}
.flame-row{position:absolute;left:0;right:0}
.flame-row[data-depth="0"]{top:0;height:18px}
.flame-row[data-depth="1"]{top:20px;height:16px}
.flame-row[data-depth="2"]{top:38px;height:14px}
.flame-bar{position:absolute;height:100%;border-radius:3px;display:flex;align-items:center;padding:0 5px;font-family:'Fira Code',monospace;font-size:7px;font-weight:500;color:rgba(0,0,0,.8);overflow:hidden;white-space:nowrap;opacity:.85;cursor:pointer;transition:width .5s}
.flame-bar:hover{opacity:1}
.flame-bar .fb-dur{margin-left:auto;padding-left:4px;opacity:.6}
.flame-axis{display:flex;justify-content:space-between;font-size:7px;color:var(--text3);font-family:'Fira Code',monospace;padding-top:1px}

/* Split */
.split{flex:1;display:flex;min-height:0}

/* Left — conversation */
.left-pane{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane-tab{height:26px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);gap:6px;flex-shrink:0}
.pane-tab .ptd{width:5px;height:5px;border-radius:50%;background:var(--lav)}
.chat-scroll{flex:1;overflow-y:auto;padding:8px 0}
.chat-inner{padding:0 12px;display:flex;flex-direction:column;gap:5px}
.turn-label{display:flex;align-items:center;gap:6px;padding:2px 0}
.turn-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:1px 8px;font-size:8px;color:var(--text2);font-weight:500}
.turn-line{flex:1;height:1px;background:var(--border)}
.msg-user{align-self:flex-end;max-width:85%;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.12);border-radius:var(--r) var(--r) 2px var(--r);padding:5px 9px;font-size:12px}
.msg-ai{font-size:12px;padding:1px 0;line-height:1.55}
.msg-ai code{font-family:'Fira Code',monospace;font-size:10px;background:var(--bg3);border:1px solid var(--border);padding:1px 3px;border-radius:2px;color:var(--lav)}

/* Clickable run reference */
.run-ref{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-family:'Fira Code',monospace;font-size:10px;transition:.15s}
.run-ref:hover{border-color:var(--lav);background:var(--bg2)}
.run-ref.sel{border-color:var(--lav);background:rgba(139,92,246,.06)}
.rrd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.rrn{font-weight:500}
.rrs{color:var(--text3)}
.rrt{color:var(--text3);margin-left:auto}

.input-bar{border-top:1px solid var(--border);background:var(--bg1);padding:7px 12px;flex-shrink:0}
.input-row{display:flex;gap:6px;align-items:flex-end}
textarea.pinput{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:6px 9px;font-size:11px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:30px;max-height:90px;line-height:1.5;transition:.15s}
textarea.pinput:focus{border-color:var(--lav)}
textarea.pinput::placeholder{color:var(--text3)}
button.sbtn{background:var(--lav);border:none;border-radius:var(--r);color:#fff;padding:6px 14px;font-size:10px;font-weight:600;cursor:pointer;transition:.15s}
button.sbtn:hover{filter:brightness(1.15)}

/* Right — inspector */
.right-pane{width:42%;min-width:280px;display:flex;flex-direction:column;background:var(--bg)}
.insp-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;font-style:italic}
.inspector{flex:1;overflow-y:auto;display:none;flex-direction:column}
.inspector.active{display:flex}
.insp-hdr{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
.insp-dot{width:8px;height:8px;border-radius:50%}
.insp-name{font-family:'Fira Code',monospace;font-size:12px;font-weight:600}
.insp-sub{font-size:10px;color:var(--text3)}
.insp-sp{flex:1}
.insp-dur{font-family:'Fira Code',monospace;font-size:10px;color:var(--text3)}
.insp-stat{font-size:8px;padding:1px 6px;border-radius:99px;font-weight:500}
.insp-stat.done{background:rgba(52,211,153,.08);color:var(--green);border:1px solid rgba(52,211,153,.15)}
.insp-stat.running{background:rgba(251,191,36,.08);color:var(--amber);border:1px solid rgba(251,191,36,.15)}

/* Inspector sections */
.isec{padding:6px 12px;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600;border-top:1px solid var(--border)}
.itool{display:flex;align-items:center;gap:4px;padding:3px 12px;font-family:'Fira Code',monospace;font-size:10px;color:var(--text2)}
.itool:hover{background:var(--bg2)}
.itn{flex-shrink:0}.ita{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.its{font-size:9px}.its-d{color:var(--green)}.its-r{color:var(--amber)}.its-e{color:var(--red)}
.ichild{display:flex;align-items:center;gap:5px;padding:4px 12px;font-family:'Fira Code',monospace;font-size:10px;color:var(--text2);cursor:pointer;transition:.1s}
.ichild:hover{color:var(--lav);background:var(--bg2)}
.icd{width:5px;height:5px;border-radius:50%}

/* Metrics strip in inspector */
.insp-metrics{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.im-cell{padding:5px 12px;border-bottom:1px solid var(--border);font-family:'Fira Code',monospace}
.im-cell:nth-child(odd){border-right:1px solid var(--border)}
.im-label{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.im-val{font-size:10px;color:var(--text2)}
.im-val.hi{color:var(--lav)}
.im-meter{height:2px;background:var(--bg3);border-radius:1px;margin-top:3px;overflow:hidden}
.im-meter-fill{height:100%;border-radius:1px;transition:width .5s;background:var(--lav)}

.ierr{padding:3px 12px;font-size:9px;color:var(--red)}
.iskill{padding:3px 12px;font-size:9px;color:var(--amber);font-family:'Fira Code',monospace}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.fi{animation:fadeIn .15s ease}
@keyframes growBar{from{width:0!important}}
.bar-anim{animation:growBar .5s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Bindery</span><div class="tb-sep"></div>
  <span class="tb-label">Auth Module Refactor</span><span class="tb-spacer"></span>
  <span class="tb-toggle" id="ft">▾ timeline</span>
  <div class="tb-sep"></div>
  <span class="tb-tag">glm-4.5-flash</span>
</div>

<div class="flame-wrap" id="fw">
  <div class="flame-header">Execution Timeline</div>
  <div class="flame-chart" id="flame"></div>
  <div class="flame-axis"><span>0s</span><span>10s</span><span>20s</span><span>30s</span><span>40s</span></div>
</div>

<div class="split">
  <div class="left-pane">
    <div class="pane-tab"><span class="ptd"></span>Conversation</div>
    <div class="chat-scroll"><div class="chat-inner" id="chat"></div></div>
    <div class="input-bar"><div class="input-row">
      <textarea class="pinput" placeholder="Message…" rows="1"></textarea>
      <button class="sbtn">Send</button>
    </div></div>
  </div>
  <div class="right-pane">
    <div class="pane-tab"><span class="ptd" style="background:var(--text3)"></span>Inspector</div>
    <div class="insp-empty" id="ie">Click an agent run to inspect</div>
    <div class="inspector" id="insp"></div>
  </div>
</div>

<script>
const PAL=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
let pi=0;const rc={};let ctxPct=12;let tokIn=0;let tokOut=0;let toolCt=0;
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sb(){document.querySelector('.chat-scroll').scrollTop=document.querySelector('.chat-scroll').scrollHeight;}

// Flame toggle
document.getElementById('ft').addEventListener('click',()=>{
  const w=document.getElementById('fw');w.classList.toggle('collapsed');
  document.getElementById('ft').textContent=w.classList.contains('collapsed')?'▸ timeline':'▾ timeline';
});

// Flame chart
const flame=document.getElementById('flame');
function addBar(depth,startPct,widthPct,label,color,dur){
  const b=document.createElement('div');b.className='flame-bar bar-anim';
  b.style.cssText=`left:${startPct}%;width:${widthPct}%;background:${color}`;
  b.innerHTML=`${label}<span class="fb-dur">${dur||''}</span>`;
  let row=flame.querySelector(`[data-depth="${depth}"]`);
  if(!row){row=document.createElement('div');row.className='flame-row';row.dataset.depth=depth;flame.appendChild(row);}
  row.appendChild(b);
}

// Agent data
const agents={};
const chat=document.getElementById('chat');
const insp=document.getElementById('insp');
const ie=document.getElementById('ie');

function showInsp(id){
  const a=agents[id];if(!a)return;
  ie.style.display='none';insp.className='inspector active';insp.innerHTML='';
  const st=a.elapsed?'done':'running';
  insp.innerHTML+=`<div class="insp-hdr"><span class="insp-dot" style="background:${a.color}"></span><span class="insp-name" style="color:${a.color}">${esc(a.name)}</span><span class="insp-sub">${esc(a.sub||'')}</span><span class="insp-sp"></span>${a.elapsed?`<span class="insp-dur">${a.elapsed}</span>`:''}<span class="insp-stat ${st}">${st}</span></div>`;
  // Metrics
  insp.innerHTML+=`<div class="insp-metrics"><div class="im-cell"><div class="im-label">Context</div><div class="im-val">${ctxPct}%</div><div class="im-meter"><div class="im-meter-fill" style="width:${ctxPct}%"></div></div></div><div class="im-cell"><div class="im-label">Tokens</div><div class="im-val">${tokIn.toLocaleString()} / ${tokOut.toLocaleString()}</div></div><div class="im-cell"><div class="im-label">Tools</div><div class="im-val hi">${toolCt}</div></div><div class="im-cell"><div class="im-label">Model</div><div class="im-val hi">glm-4.5-flash</div></div></div>`;
  if(a.tools.length){
    insp.innerHTML+=`<div class="isec">Tools (${a.tools.length})</div>`;
    a.tools.forEach(t=>{const ic=t.s==='done'?'✓':t.s==='error'?'✗':'●';const c=t.s==='done'?'its-d':t.s==='error'?'its-e':'its-r';insp.innerHTML+=`<div class="itool"><span class="itn" style="color:${a.color}">${esc(t.n)}</span><span class="ita">${esc(t.a)}</span><span class="its ${c}">${ic}</span></div>`;});
  }
  if(a.children.length){
    insp.innerHTML+=`<div class="isec">Sub-agents</div>`;
    a.children.forEach(cid=>{const ca=agents[cid];if(!ca)return;const ch=document.createElement('div');ch.className='ichild';ch.innerHTML=`<span class="icd" style="background:${ca.color}"></span>${esc(ca.name)} / ${esc(ca.sub||'')} <span style="color:var(--text3);margin-left:auto">${ca.elapsed||''}</span>`;ch.addEventListener('click',()=>showInsp(cid));insp.appendChild(ch);});
  }
  if(a.errors.length){a.errors.forEach(e=>{insp.innerHTML+=`<div class="ierr">⚠ ${esc(e)}</div>`;});}
  if(a.skills.length){a.skills.forEach(s=>{insp.innerHTML+=`<div class="iskill">⚡ ${esc(s)}</div>`;});}
  document.querySelectorAll('.run-ref').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
}

function regAgent(id,name,sub,parent){
  const c=clr(id);agents[id]={name,sub,color:c,tools:[],children:[],errors:[],skills:[],elapsed:null};
  if(parent&&agents[parent])agents[parent].children.push(id);
}
function turnLabel(t){const d=document.createElement('div');d.className='turn-label fi';d.innerHTML=`<span class="turn-pill">${t}</span><span class="turn-line"></span>`;chat.appendChild(d);}
function userMsg(t){const d=document.createElement('div');d.className='msg-user fi';d.textContent=t;chat.appendChild(d);sb();}
function aiMsg(h){const d=document.createElement('div');d.className='msg-ai fi';d.innerHTML=h;chat.appendChild(d);sb();}
function runRef(id){
  const a=agents[id];
  const r=document.createElement('div');r.className='run-ref fi';r.dataset.id=id;
  r.innerHTML=`<span class="rrd" style="background:${a.color}"></span><span class="rrn" style="color:${a.color}">${esc(a.name)}</span><span class="rrs">${esc(a.sub||'')}</span><span class="rrt" id="rrt-${id}"></span>`;
  r.addEventListener('click',()=>showInsp(id));
  chat.appendChild(r);sb();
}
function endRef(id,elapsed){agents[id].elapsed=elapsed;const t=document.getElementById('rrt-'+id);if(t)t.textContent=elapsed;const sel=document.querySelector('.run-ref.sel');if(sel&&sel.dataset.id===id)showInsp(id);}
function addTool(id,n,a,s){toolCt++;agents[id].tools.push({n,a,s});const sel=document.querySelector('.run-ref.sel');if(sel&&sel.dataset.id===id)showInsp(id);}
function addErr(id,m){agents[id].errors.push(m);}
function addSkill(id,s){agents[id].skills.push(s);}
function typing(){const d=document.createElement('div');d.className='msg-ai fi typing-ind';d.innerHTML='<span style="color:var(--text3)">…</span>';chat.appendChild(d);sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){turnLabel('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');ctxPct=12;tokIn=800;tokOut=0;}},
  {ms:300,fn(){addBar(0,0,25,'agent/refactor-auth',PAL[0],'11.2s');regAgent('r1','agent','refactor-auth');runRef('r1');}},
  {ms:280,fn(){addTool('r1','read','"src/auth/mod.rs"','done');ctxPct=15;tokIn=1600;tokOut=400;}},
  {ms:260,fn(){addTool('r1','edit','"src/auth/mod.rs"','done');tokIn=2400;tokOut=1200;}},
  {ms:250,fn(){addBar(1,16,9,'sub/run-tests',PAL[1],'3.8s');regAgent('r2','subagent','run-tests','r1');runRef('r2');}},
  {ms:350,fn(){addTool('r2','bash','"cargo test --package auth"','done');ctxPct=18;}},
  {ms:200,fn(){endRef('r2','3.8s');}},
  {ms:150,fn(){endRef('r1','11.2s');ctxPct=24;tokIn=3100;tokOut=1800;}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){turnLabel('Turn 2');userMsg('Add rate limiting and deploy to staging.');}},
  {ms:280,fn(){addBar(0,28,72,'agent/add-rate-limit',PAL[2],'32.1s');regAgent('r3','agent','add-rate-limit');runRef('r3');}},
  {ms:280,fn(){addTool('r3','write','"src/middleware/rate_limit.rs"','done');ctxPct=32;tokIn=4200;tokOut=2400;}},
  {ms:200,fn(){addBar(1,33,12,'sub/write-tests',PAL[3],'5.1s');regAgent('r4','subagent','write-tests','r3');runRef('r4');}},
  {ms:300,fn(){addTool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endRef('r4','5.1s');}},
  {ms:150,fn(){addBar(1,47,42,'sub/deploy-staging',PAL[4],'18.4s');regAgent('r5','subagent','deploy-staging','r3');runRef('r5');}},
  {ms:400,fn(){addTool('r5','bash','"./scripts/deploy.sh staging"','done');ctxPct=40;}},
  {ms:200,fn(){endRef('r5','18.4s');}},
  {ms:150,fn(){endRef('r3','32.1s');ctxPct=48;tokIn=6200;tokOut=3400;}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Deployed to staging.');}},
  {ms:700,fn(){turnLabel('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');}},
  {ms:280,fn(){regAgent('r6','agent','audit-auth-guards');runRef('r6');}},
  {ms:300,fn(){addTool('r6','find','"src/web/routes" *.rs','done');ctxPct=52;}},
  {ms:300,fn(){addTool('r6','bash','"rg -n auth_required src/web"','running');ctxPct=55;}},
  {ms:400,fn(){addSkill('r6','/skill:security-audit OWASP checklist');addTool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){addTool('r6','grep','"inject|sql|xss" routes/','done');ctxPct=58;}},
  {ms:300,fn(){addErr('r6','Rate limit hit on zai API — retrying');addTool('r6','api','retry #1','running');}},
  {ms:500,fn(){addTool('r6','api','retry #1','done');ctxPct=62;tokIn=9800;tokOut=5200;}},
  {ms:200,fn(){endRef('r6','22.7s');}},
  {ms:300,fn(){rmTyping();aiMsg('Found 3 endpoints missing <code>#[auth_required]</code>.');}},
];
let ei=0;function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);
const ta=document.querySelector('textarea');const btn=document.querySelector('button.sbtn');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,90)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';});
</script>
</body>
</html>
