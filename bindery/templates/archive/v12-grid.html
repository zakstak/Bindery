<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Grid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;--border:#28243a;--border2:#342f4e;--text:#e0dced;--text2:#908ca5;--text3:#5c5878;--lav:#8b5cf6;--rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--r:5px}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;flex-direction:column}

.topbar{height:36px;min-height:36px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-logo{font-size:16px;font-weight:700;color:var(--lav)}
.tb-sep{width:1px;height:16px;background:var(--border2)}
.tb-label{font-size:11px;color:var(--text2)}
.tb-spacer{flex:1}
.tb-tag{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:1px 7px;border-radius:99px}
.tb-stat{display:flex;align-items:center;gap:5px;font-family:'Fira Code',monospace;font-size:10px;color:var(--text2)}
.tb-stat .ct{color:var(--lav);font-weight:500}

/* Grid layout */
.grid-scroll{flex:1;overflow-y:auto;padding:12px 16px}
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}

/* Message cards — span full width */
.msg-card{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.msg-card.user .mc-bubble{background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:var(--r);padding:6px 10px;font-size:12px;max-width:70%}
.msg-card.ai .mc-bubble{font-size:12px;line-height:1.55;max-width:90%}
.mc-bubble code{font-family:'Fira Code',monospace;font-size:10px;background:var(--bg3);border:1px solid var(--border);padding:1px 3px;border-radius:2px;color:var(--lav)}
.msg-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600;padding:8px 0 2px;grid-column:1/-1}

/* Agent tile */
.agent-tile{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.agent-tile:hover{border-color:var(--border2)}
.at-head{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s}
.at-head:hover{background:var(--bg2)}
.at-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.at-dot.run{animation:pulse 1.3s infinite}
.at-name{font-family:'Fira Code',monospace;font-size:11px;font-weight:600}
.at-sub{font-size:10px;color:var(--text3)}
.at-sp{flex:1}
.at-dur{font-family:'Fira Code',monospace;font-size:9px;color:var(--text3)}
.at-stat{font-size:8px;padding:1px 6px;border-radius:99px;font-weight:500}
.at-stat.running{background:rgba(251,191,36,.08);color:var(--amber);border:1px solid rgba(251,191,36,.15)}
.at-stat.done{background:rgba(52,211,153,.08);color:var(--green);border:1px solid rgba(52,211,153,.15)}

.at-body{flex:1;padding:4px 0;max-height:200px;overflow-y:auto}
.at-tool{display:flex;align-items:center;gap:4px;padding:2px 12px;font-family:'Fira Code',monospace;font-size:9px;color:var(--text2)}
.at-tool:hover{background:var(--bg2)}
.at-tn{flex-shrink:0}.at-ta{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-ts{font-size:8px}
.ats-d{color:var(--green)}.ats-r{color:var(--amber)}.ats-e{color:var(--red)}

/* Children indicator */
.at-children{border-top:1px solid var(--border);padding:4px 12px;display:flex;gap:4px;flex-wrap:wrap}
.at-child{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--text3);font-family:'Fira Code',monospace;padding:1px 5px;background:var(--bg3);border-radius:var(--r)}
.at-child .acd{width:4px;height:4px;border-radius:50%}

.at-footer{border-top:1px solid var(--border);padding:3px 12px;font-size:8px;color:var(--text3);display:flex;gap:8px}

/* Error / skill / notification rows inside tiles */
.at-err{padding:2px 12px;font-size:9px;color:var(--red)}
.at-skill{padding:2px 12px;font-size:9px;color:var(--amber);font-family:'Fira Code',monospace}

.input-bar{border-top:1px solid var(--border);background:var(--bg1);padding:8px 16px;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea.pinput{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:6px 10px;font-size:12px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:32px;max-height:100px;line-height:1.5;transition:.15s}
textarea.pinput:focus{border-color:var(--lav)}
textarea.pinput::placeholder{color:var(--text3)}
button.sbtn{background:var(--lav);border:none;border-radius:var(--r);color:#fff;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
button.sbtn:hover{filter:brightness(1.15)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);scale:.98}to{opacity:1;transform:none;scale:1}}
.fi{animation:fadeIn .25s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Bindery</span><div class="tb-sep"></div>
  <span class="tb-label">Auth Module Refactor</span><span class="tb-spacer"></span>
  <div class="tb-stat">agents: <span class="ct" id="agent-ct">0</span></div>
  <div class="tb-sep"></div>
  <div class="tb-stat">tools: <span class="ct" id="tool-ct">0</span></div>
  <div class="tb-sep"></div>
  <span class="tb-tag">glm-4.5-flash</span>
</div>

<div class="grid-scroll"><div class="grid-container" id="grid"></div></div>

<div class="input-bar"><div class="input-row">
  <textarea class="pinput" placeholder="Message…" rows="1"></textarea>
  <button class="sbtn">Send</button>
</div></div>

<script>
const PAL=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
let pi=0;const rc={};let agentCount=0;let toolCount=0;
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sb(){document.querySelector('.grid-scroll').scrollTop=document.querySelector('.grid-scroll').scrollHeight;}

const grid=document.getElementById('grid');
const tiles={};// id -> {el,bodyEl}

function updCounters(){
  document.getElementById('agent-ct').textContent=agentCount;
  document.getElementById('tool-ct').textContent=toolCount;
}

function turnLabel(text){
  const l=document.createElement('div');l.className='msg-label';l.textContent=text;
  grid.appendChild(l);sb();
}
function userMsg(text){
  const c=document.createElement('div');c.className='msg-card user fi';
  c.innerHTML=`<div class="mc-bubble">${esc(text)}</div>`;
  grid.appendChild(c);sb();
}
function aiMsg(html){
  const c=document.createElement('div');c.className='msg-card ai fi';
  c.innerHTML=`<div class="mc-bubble">${html}</div>`;
  grid.appendChild(c);sb();
}

function addTile(id,name,sub,parentId){
  agentCount++;updCounters();
  const c=clr(id);
  const tile=document.createElement('div');tile.className='agent-tile fi';tile.id='tile-'+id;
  tile.innerHTML=`<div class="at-head"><span class="at-dot run" style="background:${c}"></span><span class="at-name" style="color:${c}">${esc(name)}</span><span class="at-sub">${esc(sub||'')}</span><span class="at-sp"></span><span class="at-dur" id="td-${id}"></span><span class="at-stat running">running</span></div><div class="at-body" id="tbody-${id}"></div>`;
  grid.appendChild(tile);
  tiles[id]={el:tile,bodyEl:document.getElementById('tbody-'+id),children:[],parentId};
  
  // Add child badge to parent if exists
  if(parentId&&tiles[parentId]){
    tiles[parentId].children.push(id);
    let cf=tiles[parentId].el.querySelector('.at-children');
    if(!cf){cf=document.createElement('div');cf.className='at-children';tiles[parentId].el.appendChild(cf);}
    cf.innerHTML+=`<span class="at-child"><span class="acd" style="background:${c}"></span>${esc(sub||name)}</span>`;
  }
  sb();
}

function endTile(id,elapsed){
  const tile=tiles[id];if(!tile)return;
  tile.el.querySelector('.at-dot')?.classList.remove('run');
  const d=document.getElementById('td-'+id);if(d)d.textContent=elapsed;
  const st=tile.el.querySelector('.at-stat');if(st){st.className='at-stat done';st.textContent='done';}
}

function addTool(id,name,args,state){
  toolCount++;updCounters();
  const body=tiles[id]?.bodyEl;if(!body)return;
  const ic=state==='done'?'✓':state==='error'?'✗':'●';
  const cls=state==='done'?'ats-d':state==='error'?'ats-e':'ats-r';
  const row=document.createElement('div');row.className='at-tool fi';
  row.innerHTML=`<span class="at-tn" style="color:${rc[id]}">${esc(name)}</span><span class="at-ta">${esc(args)}</span><span class="at-ts ${cls}">${ic}</span>`;
  body.appendChild(row);sb();
}
function addErr(id,msg){const body=tiles[id]?.bodyEl;if(!body)return;const r=document.createElement('div');r.className='at-err fi';r.textContent='⚠ '+msg;body.appendChild(r);}
function addSkill(id,s){const body=tiles[id]?.bodyEl;if(!body)return;const r=document.createElement('div');r.className='at-skill fi';r.textContent='⚡ '+s;body.appendChild(r);}
function typing(){const c=document.createElement('div');c.className='msg-card ai fi typing-ind';c.innerHTML='<div class="mc-bubble" style="color:var(--text3)">…</div>';grid.appendChild(c);sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){turnLabel('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');}},
  {ms:300,fn(){addTile('r1','agent','refactor-auth');}},
  {ms:280,fn(){addTool('r1','read','"src/auth/mod.rs"','done');}},
  {ms:260,fn(){addTool('r1','edit','"src/auth/mod.rs"','done');}},
  {ms:250,fn(){addTile('r2','subagent','run-tests','r1');}},
  {ms:350,fn(){addTool('r2','bash','"cargo test --package auth"','done');}},
  {ms:200,fn(){endTile('r2','3.8s');}},
  {ms:150,fn(){endTile('r1','11.2s');}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){turnLabel('Turn 2');userMsg('Add rate limiting and deploy to staging.');}},
  {ms:280,fn(){addTile('r3','agent','add-rate-limit');}},
  {ms:280,fn(){addTool('r3','write','"src/middleware/rate_limit.rs"','done');}},
  {ms:200,fn(){addTile('r4','subagent','write-tests','r3');}},
  {ms:300,fn(){addTool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endTile('r4','5.1s');}},
  {ms:150,fn(){addTile('r5','subagent','deploy-staging','r3');}},
  {ms:400,fn(){addTool('r5','bash','"./scripts/deploy.sh staging"','done');}},
  {ms:200,fn(){endTile('r5','18.4s');}},
  {ms:150,fn(){endTile('r3','32.1s');}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Deployed to staging.');}},
  {ms:700,fn(){turnLabel('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');}},
  {ms:280,fn(){addTile('r6','agent','audit-auth-guards');}},
  {ms:300,fn(){addTool('r6','find','"src/web/routes" *.rs','done');}},
  {ms:300,fn(){addTool('r6','bash','"rg -n auth_required src/web"','running');}},
  {ms:400,fn(){addSkill('r6','/skill:security-audit OWASP checklist');addTool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){addTool('r6','grep','"inject|sql|xss" routes/','done');}},
  {ms:300,fn(){addErr('r6','Rate limit hit on zai API — retrying');addTool('r6','api','retry #1','running');}},
  {ms:500,fn(){addTool('r6','api','retry #1','done');}},
  {ms:200,fn(){endTile('r6','22.7s');}},
  {ms:300,fn(){rmTyping();aiMsg('Found 3 endpoints missing <code>#[auth_required]</code>.');}},
];
let ei=0;function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);
const ta=document.querySelector('textarea');const btn=document.querySelector('button.sbtn');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,100)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';});
</script>
</body>
</html>
