<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Flame</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fira+Code:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;--border:#28243a;--border2:#342f4e;--text:#e0dced;--text2:#908ca5;--text3:#5c5878;--lav:#8b5cf6;--rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--r:4px}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;flex-direction:column}

/* Top bar */
.topbar{height:36px;min-height:36px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-logo{font-size:16px;font-weight:700;color:var(--lav)}
.tb-sep{width:1px;height:16px;background:var(--border2)}
.tb-label{font-size:11px;color:var(--text2)}
.tb-spacer{flex:1}
.tb-tag{font-size:10px;color:var(--text3);font-family:'Fira Code',monospace;background:var(--bg3);border:1px solid var(--border2);padding:1px 7px;border-radius:99px}

/* Flame chart area */
.flame-wrap{height:140px;min-height:140px;background:var(--bg1);border-bottom:1px solid var(--border);overflow:hidden;padding:6px 16px;display:flex;flex-direction:column;flex-shrink:0}
.flame-header{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px;font-weight:600}
.flame-chart{flex:1;position:relative;overflow:hidden}
.flame-row{position:absolute;left:0;right:0;display:flex;gap:2px;padding:1px 0}
.flame-row[data-depth="0"]{top:0;height:28px}
.flame-row[data-depth="1"]{top:30px;height:24px}
.flame-row[data-depth="2"]{top:56px;height:20px}
.flame-bar{position:absolute;height:100%;border-radius:var(--r);display:flex;align-items:center;padding:0 8px;font-family:'Fira Code',monospace;font-size:9px;font-weight:500;color:#000;overflow:hidden;white-space:nowrap;transition:width .5s ease,opacity .3s;opacity:.85;cursor:pointer}
.flame-bar:hover{opacity:1;filter:brightness(1.1)}
.flame-bar .fb-dur{margin-left:auto;padding-left:8px;font-weight:400;opacity:.7}

/* Time axis */
.flame-axis{display:flex;justify-content:space-between;padding:2px 0 0;font-size:8px;color:var(--text3);font-family:'Fira Code',monospace}

/* Chat area */
.chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-scroll{flex:1;overflow-y:auto;padding:10px 0 6px}
.chat-inner{padding:0 16px;display:flex;flex-direction:column;gap:8px}

.msg-user{align-self:flex-end;max-width:80%;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);border-radius:var(--r) var(--r) 3px var(--r);padding:7px 11px;font-size:13px}
.msg-ai{padding:2px 0;line-height:1.55;font-size:13px}
.msg-ai code{font-family:'Fira Code',monospace;font-size:11px;background:var(--bg3);border:1px solid var(--border);padding:1px 4px;border-radius:2px;color:var(--lav)}
.run-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.run-head{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;font-size:11px;transition:.1s}
.run-head:hover{background:var(--bg2)}
.run-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.run-name{font-family:'Fira Code',monospace;font-size:10px;font-weight:500}
.run-sub{font-size:10px;color:var(--text3)}
.run-sp{flex:1}
.run-time{font-family:'Fira Code',monospace;font-size:9px;color:var(--text3)}
.run-chev{font-size:8px;color:var(--text3);transition:.2s}
.run-card.col .run-chev{transform:rotate(-90deg)}
.run-body{border-top:1px solid var(--border)}
.run-card.col .run-body{display:none}
.nested{margin:2px 6px 2px 10px;border-left:2px solid var(--border2);padding-left:6px}
.tool-row{display:flex;align-items:center;gap:5px;padding:2px 10px;font-family:'Fira Code',monospace;font-size:10px;color:var(--text2)}
.tool-row:hover{background:var(--bg2)}
.tool-name{flex-shrink:0}.tool-args{color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-st{font-size:9px}.st-d{color:var(--green)}.st-e{color:var(--red)}.st-r{color:var(--amber)}
.think-bl{margin:2px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.think-hd{display:flex;align-items:center;gap:4px;padding:3px 7px;cursor:pointer;font-size:9px;color:var(--text3);font-family:'Fira Code',monospace}
.think-hd:hover{background:var(--bg3)}
.think-bd{padding:3px 7px;font-size:9px;color:var(--text3);white-space:pre-wrap;font-family:'Fira Code',monospace;border-top:1px solid var(--border)}
.think-bl.col .think-bd{display:none}
.skill-row{display:flex;align-items:center;gap:5px;padding:2px 10px;font-size:9px;font-family:'Fira Code',monospace;color:var(--text2);background:rgba(139,92,246,.06)}
.skill-badge{background:var(--lav);color:#000;font-size:8px;padding:1px 5px;border-radius:99px;font-weight:600}
.err-row{display:flex;align-items:center;gap:5px;padding:2px 10px;font-size:9px;color:var(--red)}
.notif-row{display:flex;align-items:center;gap:5px;padding:2px 10px;font-size:9px;color:var(--green)}
.turn-label{display:flex;align-items:center;gap:8px;padding:2px 0}
.turn-pill{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:1px 10px;font-size:9px;color:var(--text2);font-weight:500}
.turn-line{flex:1;height:1px;background:var(--border)}

.input-bar{border-top:1px solid var(--border);background:var(--bg1);padding:8px 16px;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea.pinput{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:12px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:34px;max-height:120px;line-height:1.5;transition:.15s}
textarea.pinput:focus{border-color:var(--lav)}
textarea.pinput::placeholder{color:var(--text3)}
button.sbtn{background:var(--lav);border:none;border-radius:var(--r);color:#fff;padding:7px 16px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:.15s}
button.sbtn:hover{filter:brightness(1.15)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.fi{animation:fadeIn .18s ease}
@keyframes growBar{from{width:0!important}}
.bar-anim{animation:growBar .6s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-logo">Bindery</span>
  <div class="tb-sep"></div>
  <span class="tb-label">Auth Module Refactor</span>
  <span class="tb-spacer"></span>
  <span class="tb-tag">glm-4.5-flash</span>
</div>

<div class="flame-wrap">
  <div class="flame-header">Execution Timeline</div>
  <div class="flame-chart" id="flame"></div>
  <div class="flame-axis"><span>0s</span><span>10s</span><span>20s</span><span>30s</span><span>40s</span></div>
</div>

<div class="chat-area">
  <div class="chat-scroll"><div class="chat-inner" id="chat"></div></div>
  <div class="input-bar"><div class="input-row">
    <textarea class="pinput" placeholder="Message…" rows="1"></textarea>
    <button class="sbtn">Send</button>
  </div></div>
</div>

<script>
const COLORS=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
const TOTAL_S=45;const chart=document.getElementById('flame');
let barId=0;
function addBar(depth,startPct,widthPct,label,color,dur){
  const b=document.createElement('div');
  b.className='flame-bar bar-anim';
  b.style.cssText=`left:${startPct}%;width:${widthPct}%;background:${color};top:0`;
  b.innerHTML=`${label}<span class="fb-dur">${dur||''}</span>`;
  let row=chart.querySelector(`[data-depth="${depth}"]`);
  if(!row){row=document.createElement('div');row.className='flame-row';row.dataset.depth=depth;chart.appendChild(row);}
  row.appendChild(b);return b;
}

const chat=document.getElementById('chat');
const runs={};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function sb(){document.querySelector('.chat-scroll').scrollTop=document.querySelector('.chat-scroll').scrollHeight;}
function turnLabel(t){chat.appendChild(el('div','turn-label fi',`<span class="turn-pill">${t}</span><span class="turn-line"></span>`));}
function userMsg(t){chat.appendChild(el('div','msg-user fi',esc(t)));sb();}
function aiMsg(h){const m=el('div','msg-ai fi');m.innerHTML=h;chat.appendChild(m);sb();}
function runBlock(id,name,sub,par){
  const c=COLORS[barId++%COLORS.length];
  const b=el('div','run-card fi');b.id='rb-'+id;
  b.innerHTML=`<div class="run-head"><span class="run-dot" style="background:${c}"></span><span class="run-name" style="color:${c}">${esc(name)}</span>${sub?`<span class="run-sub">${esc(sub)}</span>`:''}<span class="run-sp"></span><span class="run-time" id="rt-${id}"></span><span class="run-chev">▾</span></div><div class="run-body" id="rbody-${id}"></div>`;
  b.querySelector('.run-head').addEventListener('click',()=>b.classList.toggle('col'));
  if(par){const w=el('div','nested');w.appendChild(b);par.appendChild(w);}else chat.appendChild(b);
  sb();return document.getElementById('rbody-'+id);
}
function endRun(id,t){const b=document.getElementById('rb-'+id);if(!b)return;const d=document.getElementById('rt-'+id);if(d&&t)d.textContent=t;}
function tool(id,name,args,state){const body=runs[id]?.body;if(!body)return;const ic=state==='done'?'✓':state==='error'?'✗':'●';const cls=state==='done'?'st-d':state==='error'?'st-e':'st-r';body.appendChild(el('div','tool-row fi',`<span class="tool-name" style="color:var(--lav)">${esc(name)}</span><span class="tool-args">${esc(args)}</span><span class="tool-st ${cls}">${ic}</span>`));sb();}
function think(w,t){const b=el('div','think-bl col fi');b.innerHTML=`<div class="think-hd"><span>▾</span> thinking… <span style="flex:1"></span>${esc(w)}</div><div class="think-bd">${esc(t)}</div>`;b.querySelector('.think-hd').addEventListener('click',()=>b.classList.toggle('col'));chat.appendChild(b);sb();}
function skillR(n,d){chat.appendChild(el('div','skill-row fi',`<span class="skill-badge">skill</span>${esc(n)} <span style="color:var(--text3)">${esc(d)}</span>`));sb();}
function errR(m){chat.appendChild(el('div','err-row fi',`⚠ ${esc(m)}`));sb();}
function notifR(m){chat.appendChild(el('div','notif-row fi',`✓ ${esc(m)}`));sb();}
function typing(){chat.appendChild(el('div','msg-ai fi typing-ind','<span style="color:var(--text3)">…</span>'));sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){turnLabel('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');}},
  {ms:300,fn(){addBar(0,0,25,'agent / refactor-auth',COLORS[0],'11.2s');runs['r1']={body:runBlock('r1','agent','refactor-auth',null)};}},
  {ms:280,fn(){tool('r1','read','"src/auth/mod.rs"','done');}},
  {ms:260,fn(){tool('r1','edit','"src/auth/mod.rs"','done');}},
  {ms:250,fn(){addBar(1,16,9,'subagent / run-tests',COLORS[1],'3.8s');runs['r2']={body:runBlock('r2','subagent','run-tests',runs['r1'].body)};}},
  {ms:350,fn(){tool('r2','bash','"cargo test --package auth"','done');}},
  {ms:200,fn(){endRun('r2','3.8s');}},
  {ms:150,fn(){endRun('r1','11.2s');}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){turnLabel('Turn 2');userMsg('Add rate limiting and deploy to staging.');}},
  {ms:280,fn(){addBar(0,28,72,'agent / add-rate-limit',COLORS[2],'32.1s');runs['r3']={body:runBlock('r3','agent','add-rate-limit',null)};}},
  {ms:280,fn(){tool('r3','write','"src/middleware/rate_limit.rs"','done');}},
  {ms:200,fn(){addBar(1,33,12,'subagent / write-tests',COLORS[3],'5.1s');runs['r4']={body:runBlock('r4','subagent','write-tests',runs['r3'].body)};}},
  {ms:300,fn(){tool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endRun('r4','5.1s');}},
  {ms:150,fn(){addBar(1,47,42,'subagent / deploy-staging',COLORS[4],'18.4s');runs['r5']={body:runBlock('r5','subagent','deploy-staging',runs['r4'].body)};}},
  {ms:400,fn(){tool('r5','bash','"./scripts/deploy.sh staging"','done');}},
  {ms:200,fn(){endRun('r5','18.4s');}},
  {ms:150,fn(){endRun('r3','32.1s');}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Deployed to staging — smoke tests passed.');}},
  {ms:700,fn(){turnLabel('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');}},
  {ms:280,fn(){runs['r6']={body:runBlock('r6','agent','audit-auth-guards',null)};}},
  {ms:300,fn(){tool('r6','find','"src/web/routes" *.rs','done');}},
  {ms:300,fn(){tool('r6','bash','"rg -n auth_required src/web"','running');}},
  {ms:800,fn(){think('agent/r6','Looking at 12 GET routes, 8 POST routes.');}},
  {ms:400,fn(){skillR('/skill:security-audit','OWASP checklist on routes');tool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){tool('r6','grep','"inject|sql|xss" routes/','done');}},
  {ms:300,fn(){errR('Rate limit hit on zai API — retrying in 2s');tool('r6','api','retry #1','running');}},
  {ms:500,fn(){tool('r6','api','retry #1','done');}},
  {ms:200,fn(){endRun('r6','22.7s');}},
  {ms:300,fn(){notifR('Audit complete — 3 endpoints missing auth guards');rmTyping();aiMsg('Found 3 endpoints missing <code>#[auth_required]</code>.');}},
];
let ei=0;function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);
const ta=document.querySelector('textarea');const btn=document.querySelector('button.sbtn');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';});
</script>
</body>
</html>
