<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Chronicle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#12110f;--bg1:#18160f;--bg2:#1e1c16;--bg3:#2a2720;
  --border:#332f26;--border2:#3d3830;
  --text:#e8e0d0;--text2:#a09882;--text3:#706858;
  --gold:#c09a3e;--gold-dim:#8a7030;
  --green:#7ab87a;--red:#c85a5a;--amber:#d4a040;
  --r:6px;
}

html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;display:flex;flex-direction:column}

/* ═══ Header ═══ */
header{height:48px;min-height:48px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.logo{font-family:'Instrument Serif',serif;font-size:20px;color:var(--gold);letter-spacing:.02em}
.header-sep{width:1px;height:20px;background:var(--border2)}
.header-meta{font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
header .spacer{flex:1}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0}
.status-dot.run{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s ease infinite}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ Scroll area ═══ */
.chronicle{flex:1;overflow-y:auto;padding:16px 0 12px}
.chronicle-inner{max-width:960px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:12px}

/* ═══ Turn divider ═══ */
.turn-divider{display:flex;align-items:center;gap:10px;padding:4px 0}
.turn-divider::before,.turn-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.turn-divider span{font-family:'Instrument Serif',serif;font-size:12px;color:var(--text3);white-space:nowrap;font-style:italic}

/* ═══ User message ═══ */
.msg-user{position:relative;padding:10px 14px;background:linear-gradient(135deg,rgba(192,154,62,.08),rgba(192,154,62,.03));border:1px solid rgba(192,154,62,.15);border-radius:var(--r);font-size:14px;line-height:1.55}
.msg-user::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);border-radius:var(--r) 0 0 var(--r)}

/* ═══ AI message ═══ */
.msg-ai{padding:4px 0;line-height:1.7;color:var(--text)}
.msg-ai p+p{margin-top:10px}
.msg-ai code{font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--bg3);padding:2px 6px;border-radius:3px;color:var(--gold)}

/* ═══ Agent run block ═══ */
.run-block{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.run-block:hover{border-color:var(--border2)}
.run-header{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;user-select:none;transition:background .15s}
.run-header:hover{background:var(--bg2)}
.run-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all .3s}
.run-dot.run{animation:pulse 1.4s ease infinite}
.run-name{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500}
.run-sub{font-family:'Instrument Serif',serif;font-size:13px;color:var(--text3);font-style:italic}
.run-spacer{flex:1}
.run-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3)}
.run-chevron{font-size:10px;color:var(--text3);transition:transform .2s}
.run-block.collapsed .run-chevron{transform:rotate(-90deg)}
.run-body{border-top:1px solid var(--border)}
.run-block.collapsed .run-body{display:none}

/* nested run */
.nested-run{margin:6px 12px 6px 20px;border-left:2px solid var(--border2);padding-left:12px}

/* tool row */
.tool-row{display:flex;align-items:center;gap:6px;padding:4px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2);transition:background .1s}
.tool-row:hover{background:var(--bg2)}
.tool-name{flex-shrink:0}
.tool-args{color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-status{flex-shrink:0;font-size:11px}
.ts-done{color:var(--green)}.ts-run{color:var(--amber);animation:pulse 1.4s ease infinite}.ts-err{color:var(--red)}

/* thinking */
.think-block{margin:6px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.think-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--text3);font-family:'Instrument Serif',serif;font-style:italic;user-select:none}
.think-header:hover{background:var(--bg3)}
.think-body{padding:8px 12px;font-size:12px;color:var(--text3);line-height:1.7;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;border-top:1px solid var(--border)}
.think-block.collapsed .think-body{display:none}

/* special rows */
.skill-row{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text2);background:rgba(192,154,62,.04)}
.skill-badge{background:var(--gold);color:var(--bg);font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600}
.err-row{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12px;color:var(--red);background:rgba(200,90,90,.04)}
.notif-row{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12px;color:var(--green)}

/* ═══ Input ═══ */
.input-area{border-top:1px solid var(--border);background:var(--bg1);padding:10px 24px;flex-shrink:0}
.input-inner{max-width:960px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea.prompt{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:42px;max-height:160px;line-height:1.5;transition:border-color .2s}
textarea.prompt:focus{border-color:var(--gold)}
textarea.prompt::placeholder{color:var(--text3)}
button.send{background:var(--gold);border:none;border-radius:var(--r);color:var(--bg);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;transition:.15s;letter-spacing:.02em}
button.send:hover{filter:brightness(1.15)}

/* typing indicator */
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dotbounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dotbounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fi{animation:fadeUp .25s ease}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<header>
  <span class="logo">Bindery</span>
  <div class="header-sep"></div>
  <span class="header-meta">glm-4.5-flash</span>
  <span class="spacer"></span>
  <span class="header-meta" id="session-label">Auth Module Refactor</span>
  <div class="status-dot" id="gdot"></div>
</header>

<div class="chronicle"><div class="chronicle-inner" id="content"></div></div>

<div class="input-area">
  <div class="input-inner">
    <textarea class="prompt" placeholder="Write something…" rows="1"></textarea>
    <button class="send">Send</button>
  </div>
</div>

<script>
const PAL=['#c09a3e','#7ab87a','#b87ab8','#d4a040','#c85a5a','#5aafb8','#a0b85a','#d48a5a'];
let pi=0;const rc={};
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
function sb(){document.querySelector('.chronicle').scrollTop=document.querySelector('.chronicle').scrollHeight;}

const C=document.getElementById('content');
const gdot=document.getElementById('gdot');
const runs={};

function divider(text){C.appendChild(el('div','turn-divider fi',`<span>${text}</span>`));}
function userMsg(text){C.appendChild(el('div','msg-user fi',esc(text)));sb();}
function aiMsg(html){const m=el('div','msg-ai fi');m.innerHTML=html;C.appendChild(m);sb();}
function runBlock(id,name,sub,parentEl){
  const c=clr(id);
  const b=el('div','run-block fi');b.id='rb-'+id;
  b.innerHTML=`<div class="run-header"><span class="run-dot run" style="background:${c}"></span><span class="run-name" style="color:${c}">${esc(name)}</span>${sub?`<span class="run-sub">${esc(sub)}</span>`:''}<span class="run-spacer"></span><span class="run-time" id="rt-${id}"></span><span class="run-chevron">▾</span></div><div class="run-body" id="rbody-${id}"></div>`;
  b.querySelector('.run-header').addEventListener('click',()=>b.classList.toggle('collapsed'));
  if(parentEl){const w=el('div','nested-run');w.appendChild(b);parentEl.appendChild(w);}
  else C.appendChild(b);
  sb();return document.getElementById('rbody-'+id);
}
function endRun(id,elapsed){
  const b=document.getElementById('rb-'+id);if(!b)return;
  b.querySelector('.run-dot')?.classList.remove('run');
  const t=document.getElementById('rt-'+id);if(t&&elapsed)t.textContent=elapsed;
}
function tool(id,name,args,state){
  const body=runs[id]?.body;if(!body)return;
  const ic=state==='done'?'✓':state==='error'?'✗':'●';
  const cls=state==='done'?'ts-done':state==='error'?'ts-err':'ts-run';
  body.appendChild(el('div','tool-row fi',`<span class="tool-name" style="color:${clr(id)}">${esc(name)}</span><span class="tool-args">${esc(args)}</span><span class="tool-status ${cls}">${ic}</span>`));
  sb();
}
function think(who,text){
  const b=el('div','think-block collapsed fi');
  b.innerHTML=`<div class="think-header"><span>▾</span><span>thinking…</span><span style="flex:1"></span><span style="font-family:'IBM Plex Mono',monospace;font-style:normal">${esc(who)}</span></div><div class="think-body">${esc(text)}</div>`;
  b.querySelector('.think-header').addEventListener('click',()=>b.classList.toggle('collapsed'));
  C.appendChild(b);sb();
}
function skill(name,desc){C.appendChild(el('div','skill-row fi',`<span class="skill-badge">skill</span><span>${esc(name)}</span><span style="color:var(--text3)">${esc(desc)}</span>`));sb();}
function errRow(msg){C.appendChild(el('div','err-row fi',`<span>⚠</span><span>${esc(msg)}</span>`));sb();}
function notifRow(msg){C.appendChild(el('div','notif-row fi',`<span>✓</span><span>${esc(msg)}</span>`));sb();}
function typing(){const t=el('div','msg-ai fi typing-ind','<span class="typing"><span></span><span></span><span></span></span>');C.appendChild(t);sb();}
function rmTyping(){document.querySelectorAll('.typing-ind').forEach(e=>e.remove());}

const EVENTS=[
  {ms:500,fn(){divider('Turn 1');userMsg('Refactor the auth module to use async/await, then run the tests.');gdot.className='status-dot run';}},
  {ms:300,fn(){runs['r1']={body:runBlock('r1','agent','refactor-auth',null)};}},
  {ms:280,fn(){tool('r1','read','"src/auth/mod.rs"','done');}},
  {ms:260,fn(){tool('r1','edit','"src/auth/mod.rs"','done');}},
  {ms:250,fn(){runs['r2']={body:runBlock('r2','subagent','run-tests',runs['r1'].body)};}},
  {ms:350,fn(){tool('r2','bash','"cargo test --package auth"','done');}},
  {ms:200,fn(){endRun('r2','3.8s');}},
  {ms:150,fn(){endRun('r1','11.2s');gdot.className='status-dot live';}},
  {ms:350,fn(){rmTyping();aiMsg('Done. Converted all async calls in <code>auth/mod.rs</code> and <code>auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},

  {ms:700,fn(){divider('Turn 2');userMsg('Add rate limiting and deploy to staging.');gdot.className='status-dot run';}},
  {ms:280,fn(){runs['r3']={body:runBlock('r3','agent','add-rate-limit',null)};}},
  {ms:280,fn(){tool('r3','write','"src/middleware/rate_limit.rs"','done');}},
  {ms:200,fn(){runs['r4']={body:runBlock('r4','subagent','write-tests',runs['r3'].body)};}},
  {ms:300,fn(){tool('r4','bash','"cargo test rate_limit"','done');}},
  {ms:150,fn(){endRun('r4','5.1s');}},
  {ms:150,fn(){runs['r5']={body:runBlock('r5','subagent','deploy-staging',runs['r4'].body)};}},
  {ms:400,fn(){tool('r5','bash','"./scripts/deploy.sh staging"','done');}},
  {ms:200,fn(){endRun('r5','18.4s');}},
  {ms:150,fn(){endRun('r3','32.1s');gdot.className='status-dot live';}},
  {ms:350,fn(){rmTyping();aiMsg('Rate limiting added. Created <code>src/middleware/rate_limit.rs</code>, registered as a tower layer. Tests passed. Deployed to staging — smoke tests passed.');}},

  {ms:700,fn(){divider('Turn 3');userMsg('Audit all API endpoints for missing auth guards.');gdot.className='status-dot run';}},
  {ms:280,fn(){runs['r6']={body:runBlock('r6','agent','audit-auth-guards',null)};}},
  {ms:300,fn(){tool('r6','find','"src/web/routes" *.rs','done');}},
  {ms:300,fn(){tool('r6','bash','"rg -n auth_required src/web"','running');}},
  {ms:800,fn(){rmTyping();think('agent/r6','Looking at the route files… 12 GET routes, 8 POST routes. Grepping for auth_required attribute to find missing guards.');}},
  {ms:400,fn(){skill('/skill:security-audit','running OWASP checklist on src/web/routes');tool('r6','skill','/skill:security-audit','done');}},
  {ms:350,fn(){tool('r6','grep','"inject|sql|xss" routes/','done');}},
  {ms:300,fn(){errRow('Rate limit hit on zai API — retrying in 2s');tool('r6','api','retry #1','running');}},
  {ms:500,fn(){tool('r6','api','retry #1','done');}},
  {ms:200,fn(){endRun('r6','22.7s');gdot.className='status-dot live';}},
  {ms:300,fn(){notifRow('Audit complete — 3 endpoints missing auth guards flagged');rmTyping();aiMsg('Found 3 endpoints in <code>src/web/routes/admin.rs</code> missing <code>#[auth_required]</code>: <code>GET /admin/users</code>, <code>POST /admin/ban</code>, <code>DELETE /admin/session</code>. Recommend adding the guard macro and writing a test for each.');typing();}},
];

let ei=0;
function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);

// Input
const ta=document.querySelector('textarea');const btn=document.querySelector('button.send');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px';});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
btn.addEventListener('click',()=>{const t=ta.value.trim();if(!t)return;rmTyping();userMsg(t);ta.value='';ta.style.height='auto';setTimeout(()=>typing(),150);});
</script>
</body>
</html>
