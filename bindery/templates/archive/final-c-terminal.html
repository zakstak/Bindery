<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bindery — Terminal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0a12;--bg1:#110f19;--bg2:#16141f;--bg3:#1e1b2a;
  --border:#28243a;--border2:#342f4e;
  --text:#d0cce0;--text2:#8a86a0;--text3:#5a5670;
  --lav:#8b5cf6;--rose:#e879f9;--green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --r:3px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Fira Code',monospace;background:var(--bg);color:var(--text);font-size:12px;line-height:1.7;display:flex;flex-direction:column}

/* ─── Breadcrumb bar (from V11) ─── */
.bc-bar{height:32px;min-height:32px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:0;flex-shrink:0;overflow-x:auto}
.bc-logo{font-size:14px;font-weight:600;color:var(--lav);margin-right:10px;flex-shrink:0}
.bc-sep{color:var(--text3);margin:0 5px;font-size:9px;flex-shrink:0}
.bc-item{font-size:10px;padding:2px 8px;border-radius:var(--r);cursor:pointer;transition:.15s;flex-shrink:0;display:flex;align-items:center;gap:4px;color:var(--text2)}
.bc-item:hover{background:var(--bg2);color:var(--text)}
.bc-item.active{background:var(--lav-dim,rgba(139,92,246,.1));color:var(--lav)}
.bc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bc-spacer{flex:1}
.bc-tag{font-size:8px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:99px;border:1px solid var(--border2);flex-shrink:0}

/* ─── Main: stream + status strip ─── */
.main{flex:1;display:flex;min-height:0}

/* Stream */
.stream{flex:1;display:flex;flex-direction:column;min-width:0}
.stream-scroll{flex:1;overflow-y:auto;padding:6px 0}
.stream-inner{padding:0 14px}
.line{padding:1px 0;white-space:pre-wrap;word-break:break-word}
.l-prompt{color:var(--lav)}.l-prompt .arrow{color:var(--rose)}
.l-info{color:var(--text2)}
.l-agent{font-weight:500}
.l-tool{color:var(--text2)}
.l-tool .tn{color:var(--lav)}.l-tool .ta{color:var(--text3)}.l-tool .ts-ok{color:var(--green)}.l-tool .ts-run{color:var(--amber)}.l-tool .ts-err{color:var(--red)}
.l-think{color:var(--text3);font-style:italic}
.l-ai{color:var(--text)}
.l-err{color:var(--red)}
.l-ok{color:var(--green)}
.l-skill{color:var(--amber)}
.l-sep{color:var(--text3);user-select:none}
.l-n1{padding-left:18px}.l-n2{padding-left:36px}
.l-ts{color:var(--text3);margin-right:6px;user-select:none}

/* ─── Status strip (slim right panel from V6) ─── */
.status-strip{width:160px;min-width:160px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;font-size:10px}
.ss-head{padding:5px 10px;font-size:7px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);border-bottom:1px solid var(--border)}
.ss-row{padding:5px 10px;border-bottom:1px solid var(--border)}
.ss-label{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.ss-val{font-size:9px;color:var(--text2)}
.ss-val.hi{color:var(--lav)}
.ss-meter{height:2px;background:var(--bg3);border-radius:1px;margin-top:3px;overflow:hidden}
.ss-meter-fill{height:100%;border-radius:1px;transition:width .5s;background:var(--lav)}
.ss-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.ss-dot.run{background:var(--amber);animation:pulse 1.3s infinite}
.ss-dot.live{background:var(--green)}
.ss-log{flex:1;overflow-y:auto;padding:2px 0}
.ss-log-item{padding:1px 10px;font-size:7px;color:var(--text3)}

/* ─── Input ─── */
.input-line{border-top:1px solid var(--border);background:var(--bg1);padding:6px 14px;display:flex;align-items:center;gap:0;flex-shrink:0}
.input-sym{color:var(--lav);margin-right:6px;flex-shrink:0;font-weight:500}
input.cmd{flex:1;background:transparent;border:none;color:var(--text);font-family:'Fira Code',monospace;font-size:12px;outline:none;line-height:1.7}
input.cmd::placeholder{color:var(--text3)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.fi{animation:fadeIn .12s ease}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
</style>
</head>
<body>

<div class="bc-bar" id="bc-bar">
  <span class="bc-logo">Bindery</span>
  <span class="bc-spacer"></span>
  <span class="bc-tag">glm-4.5-flash</span>
</div>

<div class="main">
  <div class="stream">
    <div class="stream-scroll"><div class="stream-inner" id="out"></div></div>
    <div class="input-line">
      <span class="input-sym">❯</span>
      <input class="cmd" placeholder="Type a message…" id="cmdinput">
    </div>
  </div>

  <div class="status-strip">
    <div class="ss-head">Status</div>
    <div class="ss-row"><div class="ss-label">State</div><div class="ss-val"><span class="ss-dot" id="sdot"></span><span id="sstate">idle</span></div></div>
    <div class="ss-row"><div class="ss-label">Model</div><div class="ss-val hi">glm-4.5-flash</div></div>
    <div class="ss-row"><div class="ss-label">Context</div><div class="ss-val" id="sctx">12%</div><div class="ss-meter"><div class="ss-meter-fill" id="sctx-fill" style="width:12%"></div></div></div>
    <div class="ss-row"><div class="ss-label">Tokens</div><div class="ss-val" id="stok">0 / 0</div></div>
    <div class="ss-row"><div class="ss-label">Tools</div><div class="ss-val" id="stool">0</div></div>
    <div class="ss-head">Log</div>
    <div class="ss-log" id="slog"></div>
  </div>
</div>

<script>
const PAL=['#8b5cf6','#34d399','#e879f9','#fbbf24','#fb7185','#38bdf8'];
let pi=0;const rc={};let toolCt=0;
function clr(id){if(!rc[id])rc[id]=PAL[pi++%PAL.length];return rc[id];}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ts(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}

const out=document.getElementById('out');
const slog=document.getElementById('slog');
const sdot=document.getElementById('sdot');
const sstate=document.getElementById('sstate');
function sb(){document.querySelector('.stream-scroll').scrollTop=document.querySelector('.stream-scroll').scrollHeight;}
function line(cls,html){const d=document.createElement('div');d.className='line fi '+cls;d.innerHTML=html;out.appendChild(d);sb();}
function logS(msg){slog.innerHTML+=`<div class="ss-log-item">${ts()} ${esc(msg)}</div>`;slog.scrollTop=slog.scrollHeight;}
function updCtx(p){document.getElementById('sctx').textContent=p+'%';const f=document.getElementById('sctx-fill');f.style.width=p+'%';f.style.background=p>70?'var(--amber)':p>50?'var(--rose)':'var(--lav)';}
function updTok(i,o){document.getElementById('stok').textContent=i.toLocaleString()+' / '+o.toLocaleString();}
function updTools(){toolCt++;document.getElementById('stool').textContent=toolCt;}
function setState(s){sstate.textContent=s;sdot.className='ss-dot '+(s==='running'?'run':'live');}

// Breadcrumb nav (from V11)
const bcBar=document.getElementById('bc-bar');
const agentStack=[];// [{id,name,sub,color}]

function pushAgent(id,name,sub){
  const c=clr(id);
  agentStack.push({id,name,sub,color:c});
  rebuildBC();
}
function popAgent(){
  agentStack.pop();
  rebuildBC();
}
function rebuildBC(){
  bcBar.querySelectorAll('.bc-item,.bc-sep').forEach(e=>e.remove());
  const sp=bcBar.querySelector('.bc-spacer');
  agentStack.forEach((a,i)=>{
    const sep=document.createElement('span');sep.className='bc-sep';sep.textContent='›';
    bcBar.insertBefore(sep,sp);
    const item=document.createElement('div');
    item.className='bc-item'+(i===agentStack.length-1?' active':'');
    item.innerHTML=`<span class="bc-dot" style="background:${a.color}"></span>${esc(a.name)} / ${esc(a.sub||'')}`;
    bcBar.insertBefore(item,sp);
  });
}

function sep(){line('l-sep','─'.repeat(70));}
function prompt(text){line('l-prompt',`<span class="arrow">❯</span> ${esc(text)}`);}
function agent(id,name,sub,nest){const c=clr(id);line('l-agent'+(nest?' l-n'+nest:''),`<span class="l-ts">${ts()}</span><span style="color:${c}">▶ ${esc(name)}</span> <span style="color:var(--text3)">${esc(sub||'')}</span>`);logS(name+' started');pushAgent(id,name,sub);}
function endAgent(name,elapsed,nest){line('l-agent'+(nest?' l-n'+nest:''),`<span class="l-ts">${ts()}</span><span style="color:${rc[agentStack[agentStack.length-1]?.id]||'var(--text3)'}">■ ${esc(name)}</span> <span style="color:var(--text3)">${esc(elapsed)}</span>`);logS(`${name} done ${elapsed}`);popAgent();}
function toolLine(id,name,args,state,nest){
  updTools();
  const ic=state==='done'?'<span class="ts-ok">✓</span>':state==='error'?'<span class="ts-err">✗</span>':'<span class="ts-run">●</span>';
  line('l-tool'+(nest?' l-n'+nest:''),`<span class="l-ts">${ts()}</span>  ${ic} <span class="tn">${esc(name)}</span> <span class="ta">${esc(args)}</span>`);
  logS(`tool:${name} ${state}`);
}
function thinkLine(who,text){line('l-think',`<span class="l-ts">${ts()}</span>  💭 ${esc(who)}: ${esc(text)}`);}
function aiLine(html){line('l-ai',html);}
function errLine(text){line('l-err',`<span class="l-ts">${ts()}</span>  ⚠ ${esc(text)}`);logS('ERR: '+text);}
function okLine(text){line('l-ok',`<span class="l-ts">${ts()}</span>  ✓ ${esc(text)}`);}
function skillLine(name,desc){line('l-skill',`<span class="l-ts">${ts()}</span>  ⚡ ${esc(name)} ${esc(desc)}`);}

const EVENTS=[
  {ms:500,fn(){sep();prompt('Refactor the auth module to use async/await, then run the tests.');setState('running');updCtx(12);updTok(800,0);}},
  {ms:300,fn(){agent('r1','agent','refactor-auth',0);}},
  {ms:280,fn(){toolLine('r1','read','"src/auth/mod.rs"','done',1);updCtx(15);updTok(1600,400);}},
  {ms:260,fn(){toolLine('r1','edit','"src/auth/mod.rs"','done',1);updTok(2400,1200);}},
  {ms:250,fn(){agent('r2','subagent','run-tests',1);}},
  {ms:350,fn(){toolLine('r2','bash','"cargo test --package auth"','done',2);updCtx(18);}},
  {ms:200,fn(){endAgent('subagent','3.8s',1);}},
  {ms:150,fn(){endAgent('agent','11.2s',0);setState('idle');updCtx(24);updTok(3100,1800);}},
  {ms:350,fn(){aiLine('Done. Converted all async calls in <code style="color:var(--lav)">auth/mod.rs</code> and <code style="color:var(--lav)">auth/token.rs</code>. Tests pass: 14 passed, 0 failed.');}},
  {ms:700,fn(){sep();prompt('Add rate limiting and deploy to staging.');setState('running');}},
  {ms:280,fn(){agent('r3','agent','add-rate-limit',0);}},
  {ms:280,fn(){toolLine('r3','write','"src/middleware/rate_limit.rs"','done',1);updCtx(32);updTok(4200,2400);}},
  {ms:200,fn(){agent('r4','subagent','write-tests',1);}},
  {ms:300,fn(){toolLine('r4','bash','"cargo test rate_limit"','done',2);}},
  {ms:150,fn(){endAgent('subagent','5.1s',1);}},
  {ms:150,fn(){agent('r5','subagent','deploy-staging',1);}},
  {ms:400,fn(){toolLine('r5','bash','"./scripts/deploy.sh staging"','done',2);updCtx(40);}},
  {ms:200,fn(){endAgent('subagent','18.4s',1);}},
  {ms:150,fn(){endAgent('agent','32.1s',0);setState('idle');updCtx(48);updTok(6200,3400);}},
  {ms:350,fn(){aiLine('Rate limiting added. Created <code style="color:var(--lav)">src/middleware/rate_limit.rs</code>. Deployed to staging — smoke tests passed.');}},
  {ms:700,fn(){sep();prompt('Audit all API endpoints for missing auth guards.');setState('running');}},
  {ms:280,fn(){agent('r6','agent','audit-auth-guards',0);}},
  {ms:300,fn(){toolLine('r6','find','"src/web/routes" *.rs','done',1);updCtx(52);}},
  {ms:300,fn(){toolLine('r6','bash','"rg -n auth_required src/web"','running',1);updCtx(55);}},
  {ms:800,fn(){thinkLine('agent/r6','Looking at 12 GET routes, 8 POST routes. Grepping for auth_required attribute.');}},
  {ms:400,fn(){skillLine('/skill:security-audit','OWASP checklist on routes');toolLine('r6','skill','/skill:security-audit','done',1);}},
  {ms:350,fn(){toolLine('r6','grep','"inject|sql|xss" routes/','done',1);updCtx(58);}},
  {ms:300,fn(){errLine('Rate limit hit on zai API — retrying in 2s');toolLine('r6','api','retry #1','running',1);}},
  {ms:500,fn(){toolLine('r6','api','retry #1','done',1);updCtx(62);updTok(9800,5200);}},
  {ms:200,fn(){endAgent('agent','22.7s',0);setState('idle');}},
  {ms:300,fn(){okLine('Audit complete — 3 endpoints missing auth guards');aiLine('Found 3 endpoints in <code style="color:var(--lav)">src/web/routes/admin.rs</code> missing <code style="color:var(--lav)">#[auth_required]</code>.');}},
];
let ei=0;function playNext(){if(ei>=EVENTS.length)return;const e=EVENTS[ei++];setTimeout(()=>{try{e.fn();}catch(err){console.error(err);}playNext();},e.ms);}
setTimeout(playNext,400);

const inp=document.getElementById('cmdinput');
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=inp.value.trim();if(!t)return;sep();prompt(t);inp.value='';}});
</script>
</body>
</html>
